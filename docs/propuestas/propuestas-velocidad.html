<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Velocidad del previsualizador</title>
<style>
  :root {
    --bg: #ecebe5; --surface: #ffffff; --surface-2: #f6f5f1; --line: #e2e0d8; --line-2: #cfccc2; --zone: #ffffff;
    --text: #2c2c2a; --text-2: #5f5e5a; --text-3: #9a9890; --accent: #534ab7; --accent-soft: #eeedfe; --hover: rgba(0,0,0,.05);
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 30px rgba(0,0,0,.14);
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: var(--text);
  }
  [data-theme='dark'] {
    --bg: #303030; --surface: #242424; --surface-2: #2c2c2c; --line: #3a3a3a; --line-2: #525252; --zone: #1d1d1d;
    --text: #f0f0f0; --text-2: #c2c2c2; --text-3: #929292; --accent: #8f9bff; --accent-soft: #383c66; --hover: rgba(255,255,255,.07);
    --shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .seg { display: flex; background: var(--bg); border-radius: 9px; padding: 3px; }
  .seg button { border: none; background: transparent; padding: 5px 12px; border-radius: 7px; color: var(--text-2); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .about { flex: 1 1 100%; order: 9; color: var(--text-2); }
  .page { padding: 24px; display: flex; flex-direction: column; gap: 22px; max-width: 900px; }
  .demo { background: var(--zone); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px 16px; }
  .demo h3 { margin: 0 0 3px; font-size: 14px; }
  .demo p { margin: 0 0 14px; color: var(--text-2); line-height: 1.45; }
  /* the preview's controls bar, as in the app */
  .bar { position: relative; display: flex; align-items: center; gap: 6px; padding-top: 70px; }
  .ic { width: 30px; height: 30px; padding: 0; border: none; border-radius: 7px; background: transparent; color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; }
  .ic:hover { background: var(--hover); color: var(--text); }
  .play { width: 34px; height: 30px; border-radius: 7px; border: none; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
  [data-theme='dark'] .play { color: #17161f; }
  .time { font-variant-numeric: tabular-nums; font-size: 15px; margin: 0 6px; }
  .time small { color: var(--text-3); font-size: 12px; }
  .mode { margin-left: auto; }
  .speed-on { color: var(--accent) !important; }

  /* 1 · segmented, always visible */
  .s1 { display: flex; background: var(--bg); border-radius: 8px; padding: 2px; }
  .s1 button { border: none; background: transparent; padding: 3px 8px; border-radius: 6px; color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .s1 button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); font-weight: 600; }
  /* 2 · one button that cycles */
  .s2 { min-width: 46px; height: 26px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 13px; background: transparent; font-weight: 600; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .s2:hover { border-color: var(--text-3); color: var(--text); }
  /* 3 · stepper */
  .s3 { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .s3 button { width: 24px; height: 26px; border: none; background: transparent; color: var(--text-2); font-size: 15px; }
  .s3 button:hover { background: var(--hover); color: var(--text); }
  .s3 span { min-width: 44px; text-align: center; font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; border-left: 1px solid var(--line); border-right: 1px solid var(--line); line-height: 26px; }
  /* 4 · slider with marks */
  .s4 { display: inline-flex; align-items: center; gap: 8px; }
  .s4 input { -webkit-appearance: none; appearance: none; width: 110px; height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--v), var(--line-2) var(--v)); }
  .s4 input::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); box-shadow: 0 0 0 1px rgba(0,0,0,.2); }
  .s4 b { min-width: 34px; font-size: 12px; font-variant-numeric: tabular-nums; }
  /* 5 · popover with a horizontal row, like the app's menus */
  .s5wrap { position: relative; }
  .s5btn { height: 26px; padding: 0 8px; border: none; border-radius: 7px; background: transparent; font-weight: 600; font-size: 12px; color: var(--text-2); display: inline-flex; align-items: center; gap: 4px; }
  .s5btn:hover, .s5btn.open { background: var(--hover); color: var(--text); }
  .s5pop { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); white-space: nowrap; }
  .s5pop .ttl { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); margin: 0 4px 6px; }
  .s5pop .row { display: flex; gap: 4px; }
  .s5pop .row button { min-width: 42px; padding: 5px 6px; border: none; border-radius: 7px; background: var(--surface-2); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-2); }
  .s5pop .row button:hover { color: var(--text); background: var(--hover); }
  .s5pop .row button.on { background: var(--accent); color: #fff; font-weight: 600; }
  [data-theme='dark'] .s5pop .row button.on { color: #17161f; }
  /* 6 · icon with the value, only when it is not normal */
  .s6 { position: relative; height: 30px; padding: 0 6px; border: none; border-radius: 7px; background: transparent; color: var(--text-2); display: inline-flex; align-items: center; gap: 4px; }
  .s6:hover { background: var(--hover); color: var(--text); }
  .s6 small { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .s6pop { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 120px; }
  .s6pop button { display: grid; grid-template-columns: 14px 1fr; gap: 8px; align-items: center; padding: 6px 10px 6px 8px; border: none; border-radius: 7px; background: transparent; text-align: left; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .s6pop button:hover { background: var(--hover); }
  .s6pop button i { font-style: normal; color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<div class="topbar">
  <b>Velocidad del previsualizador</b>
  <span style="flex:1"></span>
  <div class="seg" id="theme"><button data-t="light" class="on">Claro</button><button data-t="dark">Oscuro</button></div>
  <span class="about">Seis maneras de cambiar la velocidad, cada una dentro de la barra de controles del previsualizador. Todas funcionan: pruébalas.</span>
</div>
<div class="page" id="page"></div>

<script>
const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];
const lbl = (v) => `${String(v).replace('.', ',')}×`;
const IC = {
  prev: '<svg viewBox="0 0 20 20"><path d="M6 5v10M15 5l-7 5 7 5z"/></svg>',
  next: '<svg viewBox="0 0 20 20"><path d="M14 5v10M5 5l7 5-7 5z"/></svg>',
  play: '<svg viewBox="0 0 20 20"><path d="M6 4l10 6-10 6z" fill="currentColor"/></svg>',
  gauge: '<svg viewBox="0 0 20 20"><path d="M3.5 13.5a7 7 0 1 1 13 0"/><path d="M10 13l3.5-4.5"/><circle cx="10" cy="13" r="1" fill="currentColor"/></svg>',
  chev: '<svg viewBox="0 0 20 20" style="width:11px;height:11px"><path d="M5.5 12l4.5-4.5L14.5 12"/></svg>',
};
const V = [
  { t: '1 · Botones siempre visibles', d: 'Cuatro velocidades en un control segmentado, como «Bocetos / Style frames». Se ve siempre cuál está puesta y se cambia con un clic.',
    html: (st) => `<div class="s1">${[0.5, 1, 1.5, 2].map((v) => `<button class="${st.v === v ? 'on' : ''}" data-v="${v}">${lbl(v)}</button>`).join('')}</div>` },
  { t: '2 · Un botón que va cambiando', d: 'Una pastilla con la velocidad: cada clic pasa a la siguiente (1× → 1,25× → 1,5× → 2× → 0,5×…). Ocupa lo mínimo.',
    html: (st) => `<button class="s2 ${st.v !== 1 ? 'speed-on' : ''}" data-cycle>${lbl(st.v)}</button>` },
  { t: '3 · Menos y más', d: 'La velocidad en el centro y dos botones a los lados para bajar o subir. Fácil de entender y de ajustar paso a paso.',
    html: (st) => `<span class="s3"><button data-step="-1" title="Más lento">−</button><span class="${st.v !== 1 ? 'speed-on' : ''}">${lbl(st.v)}</span><button data-step="1" title="Más rápido">+</button></span>` },
  { t: '4 · Deslizador', d: 'Un deslizador fino como el del volumen, con la velocidad al lado. Ajusta en pasos de las velocidades habituales.',
    html: (st) => `<span class="s4"><input type="range" min="0" max="5" step="1" value="${SPEEDS.indexOf(st.v)}" style="--v:${SPEEDS.indexOf(st.v) * 20}%" data-range><b class="${st.v !== 1 ? 'speed-on' : ''}">${lbl(st.v)}</b></span>` },
  { t: '5 · Menú con fila de botones', d: 'Un botón discreto con la velocidad; al pulsarlo sale encima una fila con todas, con el mismo estilo que los menús de la app.',
    html: (st) => `<span class="s5wrap"><button class="s5btn ${st.open ? 'open' : ''} ${st.v !== 1 ? 'speed-on' : ''}" data-open>${lbl(st.v)}${IC.chev}</button>${st.open ? `<div class="s5pop"><span class="ttl">Velocidad</span><div class="row">${SPEEDS.map((v) => `<button class="${st.v === v ? 'on' : ''}" data-v="${v}">${lbl(v)}</button>`).join('')}</div></div>` : ''}</span>` },
  { t: '6 · Icono de velocímetro', d: 'Un icono de velocímetro; solo muestra el número cuando no está en velocidad normal. Al pulsarlo, una lista ordenada con una ✓ en la actual.',
    html: (st) => `<span class="s5wrap"><button class="s6 ${st.v !== 1 ? 'speed-on' : ''}" data-open title="Velocidad">${IC.gauge}${st.v !== 1 ? `<small>${lbl(st.v)}</small>` : ''}</button>${st.open ? `<div class="s6pop">${SPEEDS.map((v) => `<button data-v="${v}"><i>${st.v === v ? '✓' : ''}</i>${v === 1 ? 'Normal' : lbl(v)}</button>`).join('')}</div>` : ''}</span>` },
];
const page = document.getElementById('page');
V.forEach((v) => {
  const st = { v: 1, open: false };
  const el = document.createElement('section'); el.className = 'demo'; page.appendChild(el);
  const render = () => {
    el.innerHTML = `<h3>${v.t}</h3><p>${v.d}</p><div class="bar">
      <button class="ic">${IC.prev}</button><button class="play">${IC.play}</button><button class="ic">${IC.next}</button>
      <span class="time">0:05,2 <small>/ 1:01,9</small></span>${v.html(st)}
      <div class="seg mode"><button class="on">Bocetos</button><button>Style frames</button></div></div>`;
    const r = el.querySelector('[data-range]');
    if (r) r.oninput = () => { st.v = SPEEDS[+r.value]; render(); };
  };
  el.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) { st.open = false; render(); return; }
    if (b.dataset.v) { st.v = +b.dataset.v; st.open = false; }
    else if (b.dataset.cycle != null) st.v = SPEEDS[(SPEEDS.indexOf(st.v) + 1) % SPEEDS.length];
    else if (b.dataset.step) st.v = SPEEDS[Math.max(0, Math.min(SPEEDS.length - 1, SPEEDS.indexOf(st.v) + +b.dataset.step))];
    else if (b.dataset.open != null) st.open = !st.open;
    render();
  });
  render();
});
document.querySelectorAll('#theme button').forEach((b) => b.onclick = () => { document.documentElement.dataset.theme = b.dataset.t; document.querySelectorAll('#theme button').forEach((x) => x.classList.toggle('on', x === b)); });
</script>
</body>
</html>
