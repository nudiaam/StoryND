<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Texto al pasar el ratón</title>
<style>
  :root {
    --bg: #ecebe5; --surface: #ffffff; --surface-2: #faf9f6; --line: #e2e0d8; --line-2: #cfccc2;
    --text: #2c2c2a; --text-2: #5f5e5a; --text-3: #9a9890; --accent: #534ab7; --tile: #efece4; --zone: #ffffff;
    --chip: rgba(255,255,255,.94); --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: var(--text);
  }
  [data-theme='dark'] {
    --bg: #303030; --surface: #242424; --surface-2: #2a2a2a; --line: #3a3a3a; --line-2: #525252;
    --text: #f0f0f0; --text-2: #c2c2c2; --text-3: #929292; --accent: #8f9bff; --tile: #343434; --zone: #1d1d1d;
    --chip: rgba(29,29,29,.92); --shadow: 0 6px 22px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  button { font: inherit; color: var(--text); cursor: pointer; }
  .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .seg { display: flex; background: var(--bg); border-radius: 9px; padding: 3px; }
  .seg button { border: none; background: transparent; padding: 5px 12px; border-radius: 7px; color: var(--text-2); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .about { flex: 1 1 100%; order: 9; color: var(--text-2); }
  .page { padding: 18px 24px 60px; display: flex; flex-direction: column; gap: 26px; }
  .variant { background: var(--zone); border-radius: 16px; box-shadow: var(--shadow); padding: 16px 18px 20px; }
  .variant h2 { margin: 0 0 4px; font-size: 16px; }
  .variant p { margin: 0 0 14px; color: var(--text-2); max-width: 820px; line-height: 1.45; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
  .cell { display: flex; flex-direction: column; gap: 6px; }
  .lbl { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }

  /* the pictures */
  .pic { position: relative; width: 220px; aspect-ratio: 16 / 10; border-radius: 6px; overflow: hidden; background: var(--tile) center / cover no-repeat; }
  .pic.tall { aspect-ratio: 3 / 4; width: 150px; }
  .pic.strip { width: 120px; aspect-ratio: 3 / 2; }
  .pic.boceto { aspect-ratio: 16 / 10; }
  .badge { position: absolute; left: 6px; bottom: 6px; display: inline-flex; gap: 4px; align-items: center; font-size: 10.5px; padding: 1px 7px; border-radius: 9px; background: rgba(0,0,0,.7); color: #fff; }
  .badge.top { left: auto; right: 6px; bottom: auto; top: 6px; }

  /* Every treatment: hidden until hover (or when 'ver todos' is on). */
  .cap { position: absolute; left: 0; right: 0; bottom: 0; color: #fff; font-weight: 600; font-size: 12.5px; line-height: 1.3; opacity: 0; transform: translateY(6px); transition: opacity .18s, transform .18s; pointer-events: none; }
  .pic:hover .cap, .show .cap { opacity: 1; transform: none; }
  .veil { position: absolute; inset: 0; opacity: 0; transition: opacity .18s; pointer-events: none; }
  .pic:hover .veil, .show .veil { opacity: 1; }
  .mark { position: absolute; right: 7px; bottom: 7px; width: 20px; height: 20px; border-radius: 6px; background: var(--chip); color: var(--text-2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: opacity .18s; }
  .pic:hover .mark, .show .mark { opacity: 0; }
  .strip .cap { font-size: 11px; }

  /* A · gradient, fixed strength */
  .tA .cap { padding: 22px 10px 8px; background: linear-gradient(transparent, rgba(0,0,0,.8)); }
  /* B · gradient that adapts to how light the picture is (--tone 0..1) */
  .tB .cap { padding: 22px 10px 8px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,calc(.45 + var(--tone) * .45))); }
  /* C · the whole picture dims a little, text at the bottom */
  .tC .veil { background: rgba(0,0,0,.42); }
  .tC .cap { padding: 8px 10px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  /* D · solid band, one line */
  .tD .cap { padding: 6px 10px; background: rgba(12,12,12,.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* E · frosted glass band */
  .tE .cap { padding: 7px 10px; background: rgba(15,15,15,.42); -webkit-backdrop-filter: blur(12px) saturate(1.1); backdrop-filter: blur(12px) saturate(1.1); }
  /* F · the app's own colours: a light or dark card under the text */
  .tF .cap { left: 6px; right: 6px; bottom: 6px; padding: 6px 9px; border-radius: 7px; background: var(--chip); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
</style>
</head>
<body>
<div class="topbar">
  <b>Texto al pasar el ratón · contraste</b>
  <span style="flex:1"></span>
  <label style="display:flex;align-items:center;gap:6px;color:var(--text-2)"><input type="checkbox" id="showAll"> ver todos como si pasara el ratón</label>
  <div class="seg" id="theme"><button data-t="light" class="on">Claro</button><button data-t="dark">Oscuro</button></div>
  <span class="about">Seis tratamientos para que el texto se lea siempre, cada uno sobre todas las imágenes (la foto clara y el boceto son los casos más difíciles). Pasa el ratón por cada imagen, o activa «ver todos» para compararlas a la vez.</span>
</div>
<div class="page" id="page"></div>

<script>
const yt = (id) => `url(https://i.ytimg.com/vi/${id}/hqdefault.jpg)`;
const svg = (s) => `url('data:image/svg+xml;utf8,${encodeURIComponent(s).replace(/'/g, '%27')}')`;
const LIGHT = svg(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 200'><defs><linearGradient id='s' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#bfe0ff'/><stop offset='1' stop-color='#fbf7ee'/></linearGradient></defs><rect width='320' height='200' fill='url(#s)'/><circle cx='250' cy='55' r='26' fill='#fff6c9'/><path d='M0 150 Q80 110 160 140 T320 130 V200 H0Z' fill='#e9e2cf'/><path d='M0 170 Q100 150 200 168 T320 160 V200 H0Z' fill='#f6f1e4'/></svg>`);
const DARK = svg(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 200'><rect width='320' height='200' fill='#10131c'/><circle cx='70' cy='50' r='18' fill='#d9d4c0'/><path d='M0 140 Q90 100 170 135 T320 120 V200 H0Z' fill='#1c2233'/><path d='M0 168 Q110 150 220 170 T320 160 V200 H0Z' fill='#0b0d14'/><g fill='#fff8'><circle cx='200' cy='30' r='1.5'/><circle cx='240' cy='60' r='1'/><circle cx='280' cy='25' r='1.3'/><circle cx='150' cy='70' r='1'/></g></svg>`);
const SKETCH = svg(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 200'><rect width='320' height='200' fill='#f4f1ea'/><g fill='none' stroke='#2c2c2a' stroke-linecap='round' stroke-width='2' opacity='.8'><rect x='14' y='14' width='292' height='172'/><path d='M40 150 Q70 90 120 110 T200 95 Q240 80 280 120'/><path d='M120 110 l-10 40 M140 108 l4 42 M200 95 l-6 55 M220 92 l8 58'/><circle cx='250' cy='60' r='16'/><path d='M60 60 q20 -15 40 0 M180 50 q15 -10 30 0' stroke-width='1.4'/><path d='M30 170 H290' stroke-dasharray='4 6' stroke-width='1.2'/></g></svg>`);

const ITEMS = [
  { label: 'Foto clara', tone: .92, bg: LIGHT, text: 'Luz de tarde sobre la pista' },
  { label: 'Foto oscura', tone: .12, bg: DARK, text: 'La salida, de noche' },
  { label: 'Vídeo (YouTube)', tone: .55, bg: yt('aqz-KE-bpKQ'), text: 'transiciones', badge: true },
  { label: 'Vídeo, texto largo', tone: .5, bg: yt('9bZkp7q19f0'), text: 'Ritmo de montaje para la parte de los datos', badge: true },
  { label: 'Boceto', tone: .95, bg: SKETCH, text: 'Plano general del hipódromo', cls: 'boceto' },
  { label: 'Style frame', tone: .35, bg: yt('kJQP7kiw5Fk'), text: 'Paleta cálida', cls: 'tall' },
  { label: 'Franja de estilo', tone: .45, bg: yt('jNQXAC9IVRw'), text: 'Referencia de luz', cls: 'strip' },
];
const VARIANTS = [
  ['tA', 'A · Degradado fuerte', 'Un degradado de transparente a casi negro desde la mitad de abajo. Igual en todas las imágenes.'],
  ['tB', 'B · Degradado que se adapta', 'El mismo degradado, pero más fuerte cuanto más clara es la imagen (se mide su brillo). En las oscuras apenas se nota.'],
  ['tC', 'C · Toda la imagen se oscurece un poco', 'Al pasar el ratón la imagen entera baja de luz y el texto, con una sombra suave, queda abajo. Muy legible, cambia el aspecto de toda la imagen.'],
  ['tD', 'D · Franja sólida de una línea', 'Una franja oscura uniforme de una línea (lo que no cabe se corta con «…»).'],
  ['tE', 'E · Cristal', 'Una franja de cristal esmerilado: desenfoca lo que hay detrás y lo oscurece un poco.'],
  ['tF', 'F · Tarjeta de la app', 'Una tarjeta pequeña con los colores de la app (clara en modo claro, oscura en oscuro). No depende de la imagen.'],
];
const cell = (v, it) => {
  const badge = it.badge ? `<span class="badge top">▶ YouTube</span>` : '';
  return `<div class="cell"><span class="lbl">${it.label}</span><div class="pic ${it.cls || ''}" style="background-image:${it.bg};--tone:${it.tone}" title="${it.text}">${badge}<span class="veil"></span><span class="mark">T</span><span class="cap">${it.text}</span></div></div>`;
};
document.getElementById('page').innerHTML = VARIANTS.map(([v, t, d]) => `<section class="variant ${v}"><h2>${t}</h2><p>${d}</p><div class="row">${ITEMS.map((it) => cell(v, it)).join('')}</div></section>`).join('');
document.getElementById('showAll').onchange = (e) => document.getElementById('page').classList.toggle('show', e.target.checked);
document.querySelectorAll('#theme button').forEach((b) => b.onclick = () => { document.documentElement.dataset.theme = b.dataset.t; document.querySelectorAll('#theme button').forEach((x) => x.classList.toggle('on', x === b)); });
</script>
</body>
</html>
