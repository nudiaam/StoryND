<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apuntes y momentos clave</title>
<style>
  :root {
    --bg: #ecebe5; --surface: #ffffff; --surface-2: #faf9f6; --line: #e2e0d8; --line-2: #cfccc2;
    --text: #2c2c2a; --text-2: #5f5e5a; --text-3: #9a9890; --accent: #534ab7; --accent-soft: #eeedfe; --style: #7f77dd;
    --row-line: rgba(44,44,42,.08); --tile: #efece4; --zone-base: #ffffff; --chip-bg: rgba(255,255,255,.92); --veil: rgba(255,255,255,.55);
    --tr-bg: #fbf1dc; --tr-ink: #7a4e0b; --tr-line: #e7c98c; --note-bg: #fff6c9; --note-ink: #6b5a12; --note-line: #ecd877;
    --zone-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08); --pop-shadow: 0 2px 6px rgba(0,0,0,.08), 0 20px 50px rgba(0,0,0,.2);
    --ink-mix: #2c2c2a; --overlay: rgba(40,40,38,.62);
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: var(--text);
  }
  [data-theme='dark'] {
    --bg: #303030; --surface: #242424; --surface-2: #2a2a2a; --line: #3a3a3a; --line-2: #525252;
    --text: #f0f0f0; --text-2: #c2c2c2; --text-3: #929292; --accent: #8f9bff; --accent-soft: #383c66; --style: #8f9bff;
    --row-line: rgba(255,255,255,.07); --tile: #343434; --zone-base: #1d1d1d; --chip-bg: rgba(29,29,29,.92); --veil: rgba(255,255,255,.04);
    --tr-bg: #3d3420; --tr-ink: #f2cd8f; --tr-line: #806633; --note-bg: #3a3620; --note-ink: #ecd877; --note-line: #6b5a12;
    --zone-shadow: 0 6px 22px rgba(0,0,0,.35); --pop-shadow: 0 20px 50px rgba(0,0,0,.6); --ink-mix: #f0f0f0; --overlay: rgba(10,10,10,.78);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; background: var(--bg); border-radius: 9px; padding: 3px; }
  .seg button { border: none; background: transparent; padding: 5px 12px; border-radius: 7px; color: var(--text-2); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .page { padding: 24px 32px 120px; display: flex; flex-direction: column; gap: 18px; }
  h2 { margin: 26px 0 0; font-size: 17px; }
  .lead { margin: 0; color: var(--text-2); max-width: 900px; line-height: 1.5; }
  .about { margin: 0; color: var(--text-2); max-width: 900px; line-height: 1.5; min-height: 40px; }
  .about b { color: var(--text); }
  .label, h4 { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); margin: 0; }
  .link { font-size: 12px; color: var(--text-3); cursor: pointer; white-space: nowrap; }
  svg.i { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- the zone (as in the app now) ---------- */
  .zone { --zc: #e8603c; position: relative; width: max-content; border-radius: 16px; background: color-mix(in srgb, var(--zc) 4%, var(--zone-base)); box-shadow: var(--zone-shadow); padding-bottom: 14px; }
  .zhead { height: 56px; margin: 0 18px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--zc); }
  .order { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 7px; background: var(--zc); color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .zname { font-size: 18px; font-weight: 600; color: color-mix(in srgb, var(--zc) 55%, var(--ink-mix)); }
  .zmeta { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
  .zbtn { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); font-size: 12.5px; }
  .grid { display: grid; grid-template-columns: 92px repeat(4, 288px); column-gap: 26px; padding: 0 18px; }
  .rl { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: color-mix(in srgb, var(--zc) 45%, var(--text-3)); padding-top: 12px; border-top: 1px solid var(--row-line); }
  .first .rl { border-top: none; }
  .col { position: relative; }
  .cell { border-top: 1px solid var(--row-line); padding: 12px; position: relative; }
  .mh { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; }
  .num { min-width: 24px; height: 22px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; background: color-mix(in srgb, var(--zc) 16%, var(--surface)); color: color-mix(in srgb, var(--zc) 60%, var(--ink-mix)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--zc) 35%, transparent); }
  .dur { font-size: 12px; color: var(--text-3); }
  .mini { display: inline-flex; width: 36px; height: 8px; border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
  .mini i { display: block; height: 100%; }
  .mini.none { box-shadow: none; border: 1px dashed var(--line-2); }
  .icons { margin-left: auto; display: inline-flex; gap: 2px; }
  .ib { width: 24px; height: 22px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-3); }
  .shotbox { position: relative; width: 200px; height: 125px; }
  .shot { width: 200px; height: 125px; object-fit: cover; border-radius: 6px; display: block; }
  .slot { width: 200px; height: 125px; border: 1.5px dashed var(--line-2); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 20px; }
  .narr { font-size: 14px; line-height: 1.5; margin: 0; }
  .src-add { display: flex; gap: 12px; }

  /* hover card with the text (shared by the indicators) */
  .peek { position: absolute; z-index: 20; left: 0; top: calc(100% + 6px); width: 260px; padding: 10px 12px; border-radius: 10px; background: var(--surface); box-shadow: var(--pop-shadow); display: none; flex-direction: column; gap: 8px; }
  .has-peek:hover .peek { display: flex; }
  .peek p { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--text-2); }
  .peek ul { margin: 0; padding-left: 16px; font-size: 12.5px; line-height: 1.5; color: var(--text-2); }

  /* I1: marks in the boceto's corner */
  .marks { position: absolute; left: 7px; bottom: 7px; display: flex; gap: 4px; }
  .mark { width: 20px; height: 20px; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: var(--chip-bg); color: var(--text-2); box-shadow: 0 1px 3px rgba(0,0,0,.25); font-size: 12px; font-weight: 700; }
  .mark.note { background: var(--note-bg); color: var(--note-ink); }
  .mark svg.i { width: 12px; height: 12px; }
  /* I2: folded corner */
  .fold { position: absolute; right: 0; top: 0; width: 22px; height: 22px; border-radius: 0 6px 0 6px; background: linear-gradient(225deg, var(--bg) 50%, var(--fc) 50%); box-shadow: -1px 1px 2px rgba(0,0,0,.18); }
  .fold.desc { --fc: var(--surface-2); }
  .fold.note { --fc: var(--note-line); }
  .fold.both { --fc: var(--note-line); }
  .fold.both::after { content: ''; position: absolute; right: 26px; top: 0; width: 0; }
  /* I3: a line under the boceto */
  .under { display: flex; gap: 10px; margin-top: 6px; font-size: 11.5px; color: var(--text-3); }
  .under span { display: inline-flex; align-items: center; gap: 4px; }
  .under .n { color: var(--note-ink); }
  /* I4: tabs coming out of the boceto's left edge */
  .tabs-side { position: absolute; left: -8px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .tab-side { width: 8px; height: 22px; border-radius: 4px 0 0 4px; background: var(--line-2); }
  .tab-side.note { background: var(--note-line); }

  /* ---------- detail view (F4) ---------- */
  .stage { background: var(--overlay); border-radius: 14px; padding: 24px; display: flex; justify-content: center; }
  .card { --zc: #e8603c; width: 1100px; background: color-mix(in srgb, var(--zc) 6%, var(--surface)); border-radius: 16px; box-shadow: var(--pop-shadow); overflow: hidden; display: flex; flex-direction: column; }
  .chead { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .cbody { display: flex; }
  .main { flex: 1; min-width: 0; padding: 8px 20px 20px; }
  .main section { padding: 10px 0; border-bottom: 1px solid var(--row-line); }
  .main section:last-child { border-bottom: none; }
  .main h4 { margin-bottom: 8px; }
  .desc { font-size: 14px; line-height: 1.55; color: var(--text-2); margin: 0; }
  .row { display: flex; align-items: center; gap: 10px; }
  .big { width: 240px; height: 150px; object-fit: cover; border-radius: 6px; display: block; }
  .aside { width: 300px; flex: none; border-left: 1px solid var(--line); padding: 14px; background: var(--veil); display: flex; flex-direction: column; gap: 12px; }
  .tabs { display: flex; background: var(--bg); border-radius: 9px; padding: 3px; }
  .tabs button { flex: 1; border: none; background: transparent; padding: 4px 6px; border-radius: 7px; color: var(--text-2); font-size: 12.5px; }
  .tabs button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .notes-box { border-radius: 10px; background: var(--note-bg); color: var(--note-ink); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .note-item { display: grid; grid-template-columns: 16px 1fr; align-items: start; column-gap: 8px; font-size: 13px; line-height: 1.45; }
  .note-item input { margin: 3px 0 0; accent-color: var(--note-ink); }
  .note-item.done span { text-decoration: line-through; opacity: .6; }
  .note-add { font-size: 12px; opacity: .75; padding-left: 24px; }
  .foot-notes { border-top: 1px solid var(--line); padding: 12px 20px 16px; background: var(--note-bg); color: var(--note-ink); display: grid; grid-template-columns: 110px 1fr; column-gap: 16px; }
  .foot-notes h4 { color: var(--note-ink); opacity: .8; padding-top: 2px; }
  .refs-mini { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .refs-mini img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; display: block; }

  /* ---------- key moments ---------- */
  .key-star { color: #d9a400; }
  /* the whole column of the key moment: a frame behind its cells */
  .zone .grid { position: relative; z-index: 1; }
  .keyframe { position: absolute; z-index: 0; pointer-events: none; border-radius: 10px; }
  .k1 .keyframe { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--zc) 70%, transparent); }
  .k2 .keyframe { background: color-mix(in srgb, var(--zc) 10%, transparent); }
  .k2 .col.key .mh::after { content: 'CLAVE'; font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--zc); margin-left: 2px; }
  .k3 .keyframe { border-radius: 12px; background: var(--surface); box-shadow: 0 10px 28px rgba(0,0,0,.18), 0 0 0 1px var(--line); }
  .k4 .keyframe { border-top: 4px solid var(--zc); border-radius: 4px 4px 0 0; background: color-mix(in srgb, var(--zc) 3%, transparent); }
  .k4 .col.key .num { background: var(--zc); color: #fff; box-shadow: none; }
  /* how it shows in the script and the preview */
  .others { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 14px; max-width: 1300px; }
  .panel { background: var(--surface); border-radius: 12px; padding: 12px 16px; box-shadow: var(--zone-shadow); }
  .para { display: grid; grid-template-columns: 20px 1fr 52px; column-gap: 12px; padding: 6px 8px 6px 12px; border-left: 3px solid #e8603c; font-size: 14px; line-height: 1.55; }
  .para .pn { font-size: 11px; color: var(--text-3); line-height: 24px; text-align: right; }
  .para .ps { font-size: 12px; color: var(--text-3); text-align: right; line-height: 24px; }
  .para.key.k-1 { box-shadow: inset 0 0 0 2px color-mix(in srgb, #e8603c 60%, transparent); border-radius: 0 8px 8px 0; }
  .para.key.k-2 { background: color-mix(in srgb, #e8603c 10%, transparent); }
  .para.key.k-3 { background: var(--surface); box-shadow: 0 6px 18px rgba(0,0,0,.14); border-radius: 0 8px 8px 0; font-weight: 600; }
  .para.key.k-4 { border-left-width: 6px; font-weight: 600; }
  .tl { position: relative; display: flex; gap: 3px; height: 54px; align-items: stretch; margin-top: 10px; }
  .tl div { position: relative; border-radius: 5px; background: var(--tile); overflow: hidden; }
  .tl img { width: 100%; height: 100%; object-fit: cover; opacity: .9; }
  .tl .key.k-1 { box-shadow: 0 0 0 2px #e8603c; }
  .tl .key.k-2 { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px #e8603c; }
  .tl .key.k-3 { transform: translateY(-4px); box-shadow: 0 6px 14px rgba(0,0,0,.25); }
  .tl .key.k-4 { border-top: 4px solid #e8603c; }
  .tl .star { position: absolute; right: 4px; top: 3px; font-size: 12px; color: #ffd24a; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
</style>
</head>
<body>
  <div class="topbar">
    <span class="label">Propuestas</span>
    <div class="seg" id="theme"><button data-t="light" class="on">Claro</button><button data-t="dark">Oscuro</button></div>
  </div>
  <div class="page" id="page"></div>
<script>
  const M = '/Ejemplo/Caballos%20de%20carreras.storyboard-media/';
  const ICON = {
    desc: '<svg class="i" viewBox="0 0 20 20"><path d="M4 5h12M4 9h12M4 13h8"/></svg>',
    note: '<svg class="i" viewBox="0 0 20 20"><path d="M5 3.5h10v9l-4 4H5z"/><path d="M11 16.5v-4h4"/></svg>',
    star: '<svg class="i" viewBox="0 0 20 20"><path d="M10 3l2.2 4.5 4.8.7-3.5 3.4.8 4.8L10 14.1l-4.3 2.3.8-4.8L3 8.2l4.8-.7z"/></svg>',
    starFill: '<svg class="i" viewBox="0 0 20 20" style="fill:currentColor"><path d="M10 3l2.2 4.5 4.8.7-3.5 3.4.8 4.8L10 14.1l-4.3 2.3.8-4.8L3 8.2l4.8-.7z"/></svg>',
    tray: '<svg class="i" viewBox="0 0 20 20"><path d="M3 11l2-6h10l2 6v4H3z"/><path d="M3 11h4l1 2h4l1-2h4"/></svg>',
    expand: '<svg class="i" viewBox="0 0 20 20"><path d="M12 3.5h4.5V8M8 16.5H3.5V12M16.5 3.5L11 9M3.5 16.5L9 11"/></svg>',
    x: '<svg class="i" viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>',
  };
  const moments = [
    { n: 1, d: '~12.0 s', shot: 'boceto-1.png', style: 'style-3.png', t: 'Imagínate que vas al hipódromo y ves a todos los caballos en fila.', desc: 'Plano general del hipódromo: la cámara baja despacio hasta los caballos en fila.', notes: ['Pedir el vídeo del hipódromo a Lucía', 'Probar con música más lenta'], mini: ['#f3efe6', '#1f2a44', '#e8603c'] },
    { n: 2, d: '~2.6 s', shot: 'boceto-4.png', style: null, t: 'Así que eliges al número cuatro.', desc: '', notes: [], mini: [], key: true },
    { n: 3, d: '~6.9 s', shot: 'boceto-5.png', style: 'style-9.png', t: '¿Ganará? Pues ni idea. Al fin y al cabo, solo es un caballo que corre.', desc: 'Primer plano del número 4, desenfoque del resto.', notes: [], mini: ['#e2d9c8', '#2c2c2a'] },
    { n: 4, d: '~8.1 s', shot: 'boceto-6.png', style: null, t: 'Resulta que acertar es bastante más difícil que elegir el más bonito.', desc: '', notes: ['¿Cortar aquí o alargar?'], mini: [] },
  ];
  const mini = (m) => (m.mini.length ? `<span class="mini">${m.mini.map((c, i) => `<i style="background:${c};width:${[60, 30, 10][i] || 10}%"></i>`).join('')}</span>` : '<span class="mini none"></span>');
  const peek = (m) => `<div class="peek">${m.desc ? `<div><h4>Descripción</h4><p>${m.desc}</p></div>` : ''}${m.notes.length ? `<div><h4>Apuntes</h4><ul>${m.notes.map((x) => `<li>${x}</li>`).join('')}</ul></div>` : ''}</div>`;
  const head = (m, extra = '') => `<div class="mh"><span class="num">${m.n}</span><span class="dur">${m.d}</span>${mini(m)}${extra}<span class="icons"><span class="ib">${ICON.tray}</span><span class="ib">${ICON.expand}</span><span class="ib">${ICON.x}</span></span></div>`;

  // ---------- 1 · where the board says there is a description or notes ----------
  const IND = {
    I1: { about: '<b>I1 · Marcas en la esquina del boceto.</b> Abajo a la izquierda del boceto, como la «T» de los textos sobre imágenes: un icono de líneas si tiene descripción y una notita amarilla si tiene apuntes. Al pasar el ratón por encima se leen.',
      shot: (m) => { const k = [m.desc && `<span class="mark">${ICON.desc}</span>`, m.notes.length && `<span class="mark note">${ICON.note}</span>`].filter(Boolean).join(''); return k ? `<div class="marks has-peek">${k}${peek(m)}</div>` : ''; } },
    I2: { about: '<b>I2 · Esquina doblada.</b> La esquina de arriba a la derecha del boceto se dobla, como una hoja con algo escrito por detrás: clara si hay descripción, amarilla si hay apuntes. Muy discreto; al pasar el ratón se lee.',
      shot: (m) => (m.desc || m.notes.length ? `<div class="has-peek" style="position:absolute;inset:0"><span class="fold ${m.notes.length ? 'note' : 'desc'}"></span>${peek(m)}</div>` : '') },
    I3: { about: '<b>I3 · Una línea bajo el boceto.</b> Debajo del boceto, en pequeño: «Descripción» y «2 apuntes». Se entiende sin iconos, pero ocupa una línea en la fila del boceto.',
      under: (m) => (m.desc || m.notes.length ? `<div class="under has-peek" style="position:relative">${m.desc ? `<span>${ICON.desc} Descripción</span>` : ''}${m.notes.length ? `<span class="n">${ICON.note} ${m.notes.length} ${m.notes.length === 1 ? 'apunte' : 'apuntes'}</span>` : ''}${peek(m)}</div>` : '') },
    I4: { about: '<b>I4 · Pestañas en el borde.</b> Unas pestañitas asoman por el borde izquierdo del boceto, como separadores de un cuaderno: gris para la descripción, amarilla para los apuntes. No tapan nada de la imagen.',
      shot: (m) => { const t = [m.desc && '<span class="tab-side"></span>', m.notes.length && '<span class="tab-side note"></span>'].filter(Boolean).join(''); return t ? `<div class="tabs-side has-peek">${t}${peek(m)}</div>` : ''; } },
  };
  const boardZone = (variant, cls = '') => `<div class="zone ${cls}">
      <div class="zhead"><span class="order">1</span><span class="zname">Zona 1: intro</span><span class="zmeta">4 momentos · 29.6 s</span><button class="zbtn">Moodboard · 8</button></div>
      <div class="grid first"><div></div>${moments.map((m) => `<div class="col ${m.key && cls ? 'key' : ''}" data-col>${head(m, m.key && cls ? `<span class="key-star">${ICON.starFill}</span>` : '')}</div>`).join('')}</div>
      <div class="grid"><div class="rl">Boceto</div>${moments.map((m) => `<div class="cell"><div class="shotbox"><img class="shot" src="${M}${m.shot}" alt="">${variant?.shot ? variant.shot(m) : ''}</div>${variant?.under ? variant.under(m) : ''}</div>`).join('')}</div>
      <div class="grid"><div class="rl">Style frame</div>${moments.map((m) => `<div class="cell">${m.style ? `<img class="shot" src="${M}${m.style}" alt="">` : '<div class="slot">+</div>'}</div>`).join('')}</div>
      <div class="grid"><div class="rl">Narración</div>${moments.map((m) => `<div class="cell" style="height:92px"><p class="narr">${m.t}</p></div>`).join('')}</div>
      <div class="grid"><div class="rl">Fuente</div>${moments.map(() => '<div class="cell"><div class="src-add"><span class="link">+ cita</span><span class="link">+ enlace</span></div></div>').join('')}</div>
    </div>`;

  // ---------- 2 · notes in the detail view ----------
  const m1 = moments[0];
  const notesList = `<div class="notes-box">${m1.notes.map((x, i) => `<label class="note-item ${i === 1 ? 'done' : ''}"><input type="checkbox" ${i === 1 ? 'checked' : ''}><span>${x}</span></label>`).join('')}<span class="note-add">+ apunte</span></div>`;
  const mainCol = (extra = '') => `<div class="main">
      <section><h4>Descripción</h4><p class="desc">${m1.desc}</p></section>
      ${extra}
      <section><h4>Bocetos y transiciones</h4><div class="row"><img class="big" src="${M}boceto-1.png" alt=""><img class="big" src="${M}boceto-4.png" alt=""></div></section>
      <section><h4>Narración</h4><p class="narr" style="font-size:16px">${m1.t}</p></section>
    </div>`;
  const aside = (tabs, tab, content) => `<aside class="aside"><div class="tabs">${tabs.map(([k, l]) => `<button class="${k === tab ? 'on' : ''}">${l}</button>`).join('')}</div>${content}</aside>`;
  const refs = `<h4>Paleta</h4><span class="mini" style="width:100%;height:24px;border-radius:6px"><i style="background:#f3efe6;width:60%"></i><i style="background:#1f2a44;width:30%"></i><i style="background:#e8603c;width:10%"></i></span><h4>Imágenes</h4><div class="refs-mini"><img src="${M}foto-24.png" alt=""><img src="${M}foto-25.png" alt=""></div>`;
  const NOTES = {
    A1: { about: '<b>A1 · Una pestaña más.</b> En la columna de la derecha: «Referencias», «Apuntes» y «Descartes». Los apuntes son una lista que se puede ir tachando (lo hecho queda tachado). Mismo sitio que el resto de material de trabajo.',
      card: () => `${mainCol()}${aside([['r', 'Referencias'], ['a', 'Apuntes · 2'], ['d', 'Descartes']], 'a', notesList)}` },
    A2: { about: '<b>A2 · Debajo de la descripción.</b> En la columna central, justo bajo la descripción y separados de ella por su color de nota: la descripción cuenta qué pasa; los apuntes, lo que queda por hacer.',
      card: () => `${mainCol(`<section><h4>Apuntes</h4>${notesList}</section>`)}${aside([['r', 'Referencias'], ['d', 'Descartes']], 'r', refs)}` },
    A3: { about: '<b>A3 · Al pie de la tarjeta.</b> Una franja de nota a todo el ancho, abajo, siempre a la vista mientras trabajas en el momento, como un pósit pegado al pie de la hoja.',
      card: () => `<div style="display:flex;flex-direction:column;flex:1;min-width:0"><div class="cbody">${mainCol()}${aside([['r', 'Referencias'], ['d', 'Descartes']], 'r', refs)}</div><div class="foot-notes"><h4>Apuntes</h4>${notesList.replace('class="notes-box"', 'class="notes-box" style="background:transparent;padding:0"')}</div></div>` },
  };

  // ---------- 3 · key moments ----------
  const KEY = {
    K1: { about: '<b>K1 · Contorno.</b> El momento clave lleva una estrella junto al número y su columna se enmarca con el color de la zona. En el guion, la frase se enmarca igual; en la previsualización, su plano lleva el mismo borde.', cls: 'k1', k: 'k-1' },
    K2: { about: '<b>K2 · Fondo y etiqueta.</b> Su columna toma un fondo suave del color de la zona y la cabecera dice «CLAVE». En el guion, la frase lleva ese mismo fondo.', cls: 'k2', k: 'k-2' },
    K3: { about: '<b>K3 · En relieve.</b> La columna se levanta como una tarjeta (sombra y un poco por encima de las demás). Es lo que más «sobresale». En el guion, la frase también se eleva y va en negrita; en la previsualización, su plano sube.', cls: 'k3', k: 'k-3' },
    K4: { about: '<b>K4 · Barra arriba.</b> Una barra gruesa del color de la zona encima de la columna y el número relleno de color. En el guion, la línea de color del margen se ensancha en esa frase.', cls: 'k4', k: 'k-4' },
  };
  const others = (k) => `<div class="others">
      <div class="panel"><h4 style="margin-bottom:8px">En el guion</h4>${moments.map((m) => `<div class="para ${m.key ? 'key ' + k : ''}"><span class="pn">${m.n}</span><span>${m.t}${m.key ? ` <span class="key-star">${ICON.starFill}</span>` : ''}</span><span class="ps">${m.d}</span></div>`).join('')}</div>
      <div class="panel"><h4>En la previsualización</h4><div class="tl">${moments.map((m) => `<div class="${m.key ? 'key ' + k : ''}" style="flex:${parseFloat(m.d.slice(1))}"><img src="${M}${m.shot}" alt="">${m.key ? '<span class="star">★</span>' : ''}</div>`).join('')}</div></div>
    </div>`;

  const state = { ind: 'I1', notes: 'A1', key: 'K1' };
  const segs = (group, keys) => `<div class="seg" data-group="${group}">${keys.map((k) => `<button data-k="${k}" class="${state[group] === k ? 'on' : ''}">${k}</button>`).join('')}</div>`;
  function render() {
    document.getElementById('page').innerHTML = `
      <h2>1 · Descripción y apuntes en el tablero</h2>
      <p class="lead">La marca sale del encabezado y pasa al boceto. El momento 1 tiene descripción y apuntes, el 3 solo descripción, el 4 solo apuntes, el 2 nada. Pasa el ratón por la marca para leerlo.</p>
      ${segs('ind', Object.keys(IND))}<p class="about">${IND[state.ind].about}</p>${boardZone(IND[state.ind])}
      <h2>2 · Apuntes en la vista de detalle</h2>
      <p class="lead">Los apuntes son lo que queda por hacer o pensar en ese momento (no la descripción de lo que pasa). Aquí, una lista que se va tachando.</p>
      ${segs('notes', Object.keys(NOTES))}<p class="about">${NOTES[state.notes].about}</p>
      <div class="stage"><div class="card"><div class="chead"><span class="zname" style="font-size:16px">Zona 1: intro</span><span class="num">1</span><span class="dur">~12.0 s</span></div><div class="cbody">${NOTES[state.notes].card()}</div></div></div>
      <h2>3 · Momentos clave</h2>
      <p class="lead">El momento 2 está marcado como clave. Se marcaría con una estrella más entre los iconos de la cabecera (al pasar el ratón), o con la tecla K. Así se ve en el tablero, en el guion y en la previsualización.</p>
      ${segs('key', Object.keys(KEY))}<p class="about">${KEY[state.key].about}</p>${boardZone(null, KEY[state.key].cls)}${others(KEY[state.key].k)}`;
    // Frame the key moment's whole column (from its number to its sources).
    const z = document.querySelectorAll('.zone')[1];
    const i = moments.findIndex((m) => m.key);
    const top = z.querySelectorAll('.grid.first > .col')[i].getBoundingClientRect();
    const rows = z.querySelectorAll('.grid');
    const bottom = rows[rows.length - 1].querySelectorAll('.cell')[i].getBoundingClientRect();
    const zr = z.getBoundingClientRect();
    const f = document.createElement('div');
    f.className = 'keyframe';
    Object.assign(f.style, { left: top.left - zr.left - 6 + 'px', top: top.top - zr.top + 2 + 'px', width: top.width + 12 + 'px', height: bottom.bottom - top.top + 2 + 'px' });
    z.appendChild(f);
  }
  render();
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-group] button'); if (!b) return;
    state[b.parentElement.dataset.group] = b.dataset.k; render();
  });
  document.getElementById('theme').onclick = (e) => {
    const t = e.target.dataset.t; if (!t) return;
    document.documentElement.dataset.theme = t;
    document.querySelectorAll('#theme button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  };
</script>
</body>
</html>
