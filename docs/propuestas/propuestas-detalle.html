<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paleta en el detalle</title>
<style>
  :root {
    --bg: #ecebe5; --surface: #ffffff; --surface-2: #faf9f6; --line: #e2e0d8; --line-2: #cfccc2;
    --text: #2c2c2a; --text-2: #5f5e5a; --text-3: #9a9890; --accent: #534ab7; --accent-soft: #eeedfe;
    --row-line: rgba(44,44,42,.08); --tile: #efece4; --chip-bg: rgba(255,255,255,.92); --veil: rgba(255,255,255,.55);
    --tr-bg: #fbf1dc; --tr-ink: #7a4e0b; --tr-line: #e7c98c; --style: #7f77dd; --overlay: rgba(40,40,38,.62);
    --shadow-lg: 0 20px 60px rgba(0,0,0,.25); --ink-mix: #2c2c2a;
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: var(--text);
  }
  [data-theme='dark'] {
    --bg: #303030; --surface: #242424; --surface-2: #2a2a2a; --line: #3a3a3a; --line-2: #525252;
    --text: #f0f0f0; --text-2: #c2c2c2; --text-3: #929292; --accent: #8f9bff; --accent-soft: #383c66;
    --row-line: rgba(255,255,255,.07); --tile: #343434; --chip-bg: rgba(29,29,29,.92); --veil: rgba(255,255,255,.04);
    --tr-bg: #3d3420; --tr-ink: #f2cd8f; --tr-line: #806633; --style: #8f9bff; --overlay: rgba(10,10,10,.78);
    --shadow-lg: 0 20px 60px rgba(0,0,0,.6); --ink-mix: #f0f0f0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .seg { display: flex; background: var(--bg); border-radius: 9px; padding: 3px; }
  .seg button { border: none; background: transparent; padding: 5px 12px; border-radius: 7px; color: var(--text-2); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .about { flex: 1 1 100%; color: var(--text-2); line-height: 1.45; }
  .about b { color: var(--text); }
  .label, h4 { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); margin: 0; }
  .link { font-size: 12px; color: var(--text-3); cursor: pointer; white-space: nowrap; }
  .link:hover { color: var(--accent); }

  /* the detail view, as in the app: dimmed board, card in the middle, neighbours on the sides */
  .stage { min-height: calc(100vh - 90px); background: var(--overlay); display: flex; align-items: flex-start; justify-content: center; gap: 18px; padding: 30px 20px; }
  .side { width: 150px; flex: none; align-self: center; background: var(--surface); border-radius: 12px; padding: 10px; opacity: .5; display: flex; flex-direction: column; gap: 6px; }
  .side img { width: 100%; height: 80px; object-fit: cover; border-radius: 6px; }
  .side small { font-size: 11px; color: var(--text-3); }
  .card { --zc: #e8603c; width: min(1100px, calc(100vw - 400px)); flex: none; display: flex; flex-direction: column; background: color-mix(in srgb, var(--zc) 6%, var(--surface)); border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; }
  .head { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .zone { font-weight: 600; font-size: 16px; color: color-mix(in srgb, var(--zc) 55%, var(--ink-mix)); }
  .num { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: color-mix(in srgb, var(--zc) 20%, transparent); color: var(--zc); }
  .dur { font-size: 12px; color: var(--text-3); }
  .x { margin-left: auto; color: var(--text-3); font-size: 18px; }
  .body { display: flex; min-height: 0; }
  .main { flex: 1; min-width: 0; padding: 8px 20px 24px; }
  .main section { padding: 10px 0; border-bottom: 1px solid var(--row-line); }
  .main section:last-child { border-bottom: none; }
  .main h4 { margin-bottom: 8px; }
  .desc { font-size: 14px; line-height: 1.55; color: var(--text-2); margin: 0; }
  .row { display: flex; align-items: center; gap: 10px; }
  .shot { width: 240px; height: 150px; object-fit: cover; border-radius: 6px; display: block; }
  .shot.style { box-shadow: 0 0 0 2px var(--style); }
  .slot { width: 90px; height: 150px; border: 1.5px dashed var(--line-2); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 20px; }
  .tr { padding: 4px 10px; border-radius: 10px; background: var(--tr-bg); border: 1px solid var(--tr-line); color: var(--tr-ink); font-size: 12.5px; font-style: italic; }
  .narr { font-size: 16px; line-height: 1.6; margin: 0; }
  .adds { display: flex; gap: 12px; }
  .aside { width: 230px; flex: none; border-left: 1px solid var(--line); padding: 14px; background: var(--veil); display: flex; flex-direction: column; gap: 10px; }
  .aside.left { border-left: none; border-right: 1px solid var(--line); width: 260px; }
  .aside.wide { width: 280px; }
  .aside .hint { font-size: 12px; color: var(--text-3); line-height: 1.5; margin: 0; }
  .discard img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; opacity: .85; display: block; }
  .discard .links { display: flex; gap: 10px; margin-top: 4px; }
  .sep { height: 1px; background: var(--line); margin: 4px -14px; }
  .tabs { display: flex; background: var(--bg); border-radius: 9px; padding: 3px; }
  .tabs button { flex: 1; border: none; background: transparent; padding: 4px 8px; border-radius: 7px; color: var(--text-2); font-size: 12.5px; }
  .tabs button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .hrow { display: flex; align-items: center; gap: 10px; }
  .hrow .link { margin-left: auto; }

  /* the palette (D4) */
  .dbar { display: flex; gap: 4px; }
  .dseg { position: relative; display: flex; border-radius: 7px; overflow: hidden; min-width: 58px; }
  .dseg[data-tier="30"] { min-width: 88px; }
  .dseg.empty { border: 1.5px dashed var(--line-2); }
  .dseg i { flex: 1; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  .dseg .hint { margin: auto; font-size: 11px; color: var(--text-3); }
  .dlabels { display: flex; gap: 4px; margin-top: 6px; }
  .dlabels > div { min-width: 58px; }
  .dlabels > div:nth-child(2) { min-width: 88px; }
  .from { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .sw { width: 26px; height: 26px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); flex: none; }
  .imgs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .imgs img, .imgs .add { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; display: block; }
  .imgs .add { border: 1.5px dashed var(--line-2); display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 18px; }
  /* inside the card (F3): a row of pictures */
  .imgs.row4 { grid-template-columns: repeat(4, 160px); }
  .imgs.row4 img, .imgs.row4 .add { height: 100px; }
  .pal-inline { display: grid; grid-template-columns: 420px 1fr; gap: 24px; align-items: start; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="seg" id="variants">
      <button data-v="F1">F1 · Lateral izquierdo</button>
      <button data-v="F2">F2 · Lateral derecho</button>
      <button data-v="F3">F3 · Dentro de la tarjeta</button>
      <button data-v="F4">F4 · Pestañas a la derecha</button>
    </div>
    <div class="seg" id="theme"><button data-t="light" class="on">Claro</button><button data-t="dark">Oscuro</button></div>
    <div class="about" id="about"></div>
  </div>
  <div class="stage" id="stage"></div>
<script>
  const M = '/Ejemplo/Caballos%20de%20carreras.storyboard-media/';
  const PALETTE = ['#f3efe6', '#e2d9c8', '#1f2a44', '#3d5a8a', '#e8603c', '#2c2c2a', '#d9b44a'];
  const D = { 60: ['#f3efe6'], 30: ['#1f2a44', '#3d5a8a'], 10: ['#e8603c'] };
  const NAMES = { 60: 'Dominante', 30: 'Secundario', 10: 'Acento' };
  const bar = (h) => `<div class="dbar">${[60, 30, 10].map((t) => `<div class="dseg ${D[t].length ? '' : 'empty'}" data-tier="${t}" style="flex:${t};height:${h}px">${D[t].map((c) => `<i style="background:${c}"></i>`).join('')}</div>`).join('')}</div>
    <div class="dlabels">${[60, 30, 10].map((t) => `<div style="flex:${t}"><span class="label">${NAMES[t]}</span></div>`).join('')}</div>`;
  const from = `<div class="from">${PALETTE.map((c) => `<div class="sw" style="background:${c}"></div>`).join('')}</div>`;
  const imgs = (cls = '') => `<div class="imgs ${cls}">${['foto-24.png', 'foto-25.png', 'style-15.png'].map((f) => `<img src="${M}${f}" alt="">`).join('')}<div class="add">+</div></div>`;
  const palette = (h = 32) => `<div class="hrow"><h4>Paleta</h4><span class="link">copiar la general</span></div>${bar(h)}${from}`;
  const images = (cls) => `<div class="hrow"><h4>Imágenes</h4><span class="link">+ añadir</span></div>${imgs(cls)}`;
  const discards = `<div class="hrow"><h4>Descartes</h4></div><div class="discard"><img src="${M}boceto-2.png" alt=""><div class="links"><span class="link">como boceto</span><span class="link">como style frame</span></div></div>`;
  const main = (extra = '') => `<div class="main">
      <section><h4>Descripción</h4><p class="desc">Plano general del hipódromo: la cámara baja despacio hasta los caballos en fila. Sonido ambiente antes de la voz.</p></section>
      <section><h4>Bocetos y transiciones</h4><div class="row"><img class="shot" src="${M}boceto-1.png" alt=""><span class="tr">corte</span><img class="shot" src="${M}boceto-4.png" alt=""><div class="slot">+</div></div></section>
      <section><h4>Style frame</h4><div class="row"><img class="shot style" src="${M}style-3.png" alt=""></div></section>
      ${extra}
      <section><h4>Narración</h4><p class="narr">Imagínate que vas al hipódromo y ves a todos los caballos en fila. Sin ningún contexto, eliges al más bonito.</p></section>
      <section><h4>Fuente</h4><div class="adds"><span class="link">+ cita</span><span class="link">+ enlace</span></div></section>
    </div>`;
  const V = {
    F1: { about: '<b>F1 · Lateral izquierdo.</b> Paleta e imágenes del momento en una columna a la izquierda (260 px); Descartes sigue a la derecha. Lo que es «de referencia» a un lado y lo que se ha quitado al otro, con el trabajo en medio.',
      body: () => `<aside class="aside left">${palette()}<div class="sep"></div>${images()}</aside>${main()}<aside class="aside">${discards}</aside>` },
    F2: { about: '<b>F2 · Lateral derecho.</b> Todo lo que no es el momento en sí, en la columna de la derecha (280 px): paleta, imágenes y, al final, descartes. La columna central queda como ahora.',
      body: () => `${main()}<aside class="aside wide">${palette(28)}<div class="sep"></div>${images()}<div class="sep"></div>${discards}</aside>` },
    F3: { about: '<b>F3 · Dentro de la tarjeta.</b> Dos apartados más en la columna central, entre el style frame y la narración: «Paleta» (barra y colores) e «Imágenes» en una fila. Mismo orden que todo lo demás, sin columnas nuevas.',
      body: () => `${main(`<section><div class="pal-inline"><div>${palette()}</div><div></div></div></section><section>${images('row4')}</section>`)}<aside class="aside">${discards}</aside>` },
    F4: { about: '<b>F4 · Pestañas a la derecha.</b> La columna de la derecha tiene dos pestañas: «Referencias» (paleta e imágenes) y «Descartes». Ocupa lo mismo que ahora y no se alarga.',
      body: (tab = 'ref') => `${main()}<aside class="aside wide"><div class="tabs"><button data-tab="ref" class="${tab === 'ref' ? 'on' : ''}">Referencias</button><button data-tab="dis" class="${tab === 'dis' ? 'on' : ''}">Descartes · 1</button></div>${tab === 'ref' ? `${palette(28)}<div class="sep"></div>${images()}` : discards}</aside>` },
  };
  let cur = 'F1';
  function show(v, tab) {
    cur = v;
    document.querySelectorAll('#variants button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
    document.getElementById('about').innerHTML = V[v].about;
    document.getElementById('stage').innerHTML = `
      <div class="side"><small>Zona 1 · 0</small><img src="${M}boceto-6.png" alt=""><small>Momento anterior</small></div>
      <div class="card"><div class="head"><span class="zone">Zona 1: intro</span><span class="num">1</span><span class="dur">~12.0 s</span><span class="x">×</span></div><div class="body">${V[v].body(tab)}</div></div>
      <div class="side"><small>Zona 1 · 2</small><img src="${M}boceto-4.png" alt=""><small>Así que eliges al número cuatro.</small></div>`;
  }
  document.getElementById('variants').onclick = (e) => { if (e.target.dataset.v) show(e.target.dataset.v); };
  document.getElementById('stage').onclick = (e) => { if (e.target.dataset.tab) show(cur, e.target.dataset.tab); };
  document.getElementById('theme').onclick = (e) => {
    const t = e.target.dataset.t; if (!t) return;
    document.documentElement.dataset.theme = t;
    document.querySelectorAll('#theme button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  };
  show('F1');
</script>
</body>
</html>
