<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paleta por momento</title>
<style>
  :root {
    --bg: #ecebe5; --surface: #ffffff; --surface-2: #faf9f6; --line: #e2e0d8; --line-2: #cfccc2;
    --text: #2c2c2a; --text-2: #5f5e5a; --text-3: #9a9890; --accent: #534ab7; --accent-soft: #eeedfe;
    --row-line: rgba(44,44,42,.08); --tile: #efece4; --zone-base: #ffffff; --chip-bg: rgba(255,255,255,.92);
    --zone-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08); --pop-shadow: 0 2px 6px rgba(0,0,0,.08), 0 20px 50px rgba(0,0,0,.2);
    --ink-mix: #2c2c2a; --hover: rgba(0,0,0,.04);
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: var(--text);
  }
  [data-theme='dark'] {
    --bg: #303030; --surface: #242424; --surface-2: #2a2a2a; --line: #3a3a3a; --line-2: #525252;
    --text: #f0f0f0; --text-2: #c2c2c2; --text-3: #929292; --accent: #8f9bff; --accent-soft: #383c66;
    --row-line: rgba(255,255,255,.07); --tile: #343434; --zone-base: #1d1d1d; --chip-bg: rgba(29,29,29,.92);
    --zone-shadow: 0 6px 22px rgba(0,0,0,.35); --pop-shadow: 0 20px 50px rgba(0,0,0,.6); --ink-mix: #f0f0f0; --hover: rgba(255,255,255,.05);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .seg { display: flex; background: var(--bg); border-radius: 9px; padding: 3px; }
  .seg button { border: none; background: transparent; padding: 5px 12px; border-radius: 7px; color: var(--text-2); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .page { padding: 28px 32px 120px; display: flex; flex-direction: column; gap: 30px; }
  h2 { margin: 10px 0 0; font-size: 17px; }
  .lead { margin: -18px 0 0; color: var(--text-2); max-width: 820px; line-height: 1.5; }
  .about { color: var(--text-2); line-height: 1.5; max-width: 820px; margin: 0 0 14px; }
  .about b { color: var(--text); }
  .label { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); user-select: none; }
  .link { font-size: 12px; color: var(--text-3); cursor: pointer; user-select: none; white-space: nowrap; }
  .link:hover { color: var(--accent); }

  /* general window */
  .win { width: 600px; border-radius: 16px; background: var(--zone-base); box-shadow: var(--zone-shadow); padding: 0 18px 20px; }
  .win-head { height: 56px; display: flex; align-items: center; border-bottom: 2px solid var(--line-2); font-size: 18px; font-weight: 600; }
  .sec-head { display: flex; align-items: center; gap: 14px; height: 36px; margin-top: 8px; }

  /* palette row: the swatches, as now */
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .sw { position: relative; width: 64px; height: 64px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); display: flex; align-items: flex-end; padding: 5px; flex: none; cursor: grab; }
  .sw span { font-size: 10.5px; background: var(--chip-bg); padding: 0 5px; border-radius: 4px; color: var(--text-2); pointer-events: none; }
  .sw.sm { width: 28px; height: 28px; padding: 0; border-radius: 6px; }
  .sw.sm span { display: none; }
  .sw.used::after { content: ''; position: absolute; right: 5px; top: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--chip-bg); box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
  .sw.sm.used::after { right: 3px; top: 3px; width: 5px; height: 5px; }

  /* the 60/30/10 bar (medium thickness) */
  .dist { margin-top: 12px; }
  .dbar { display: flex; gap: 4px; }
  .dseg { position: relative; display: flex; border-radius: 7px; overflow: hidden; min-width: 0; }
  .dseg.empty { border: 1.5px dashed var(--line-2); }
  .dseg.over { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
  .dseg i { flex: 1; min-width: 0; position: relative; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  .dseg i:hover::after { content: '×'; position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; border-radius: 50%; background: var(--chip-bg); color: var(--text-2); font-size: 12px; line-height: 16px; text-align: center; font-style: normal; cursor: pointer; }
  .dseg .hint { margin: auto; font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
  .dlabels { display: flex; gap: 4px; margin-top: 6px; }
  .dlabels > div { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .dlabels b { font-size: 12px; font-variant-numeric: tabular-nums; }
  /* labels inside the bar (B) */
  .inbar .dseg::before { content: attr(data-t); position: absolute; left: 7px; top: 50%; transform: translateY(-50%); z-index: 1; font-size: 10.5px; font-weight: 600; letter-spacing: .05em; padding: 1px 6px; border-radius: 4px; background: var(--chip-bg); color: var(--text-2); pointer-events: none; white-space: nowrap; }
  /* C: bar to the left of each name, one row per group */
  .stacked .dbar { flex-direction: column; gap: 6px; }
  .stacked .drow { display: grid; grid-template-columns: 112px 1fr; align-items: center; column-gap: 12px; }
  .stacked .dseg { width: 100%; }

  /* ---------- zone with 4 moments ---------- */
  .zone { --zc: #e8603c; position: relative; width: 1180px; border-radius: 16px; background: color-mix(in srgb, var(--zc) 4%, var(--zone-base)); box-shadow: var(--zone-shadow); padding-bottom: 18px; }
  .zhead { position: relative; height: 56px; margin: 0 18px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--zc); z-index: 5; }
  .order { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 7px; background: var(--zc); color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .zname { font-size: 18px; font-weight: 600; color: color-mix(in srgb, var(--zc) 55%, var(--ink-mix)); }
  .zmeta { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
  .zbtn { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); font-size: 12.5px; }
  .zbtn:hover, .zbtn.on { border-color: var(--zc); color: var(--text); }
  .thumbs { display: inline-flex; }
  .thumbs img { width: 18px; height: 18px; border-radius: 4px; object-fit: cover; margin-left: -6px; box-shadow: 0 0 0 1.5px var(--surface); }
  .thumbs img:first-child { margin-left: 0; }
  .chev { width: 10px; height: 10px; transition: transform .15s; flex: none; }
  .on > .chev, .on .chev { transform: rotate(180deg); }
  .grid { display: grid; grid-template-columns: 92px repeat(4, 250px); column-gap: 26px; padding: 0 18px; position: relative; }
  .rl { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: color-mix(in srgb, var(--zc) 45%, var(--text-3)); padding-top: 12px; }
  .cell { border-top: 1px solid var(--row-line); padding: 12px 12px; position: relative; }
  .rl { border-top: 1px solid var(--row-line); }
  .first > * { border-top: none; }
  .mh { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; position: relative; }
  .num { min-width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: color-mix(in srgb, var(--zc) 20%, transparent); color: var(--zc); flex: none; }
  .dur { font-size: 12px; color: var(--text-3); }
  .shot { width: 200px; height: 125px; object-fit: cover; border-radius: 6px; display: block; }
  .slot { width: 200px; height: 125px; border: 1.5px dashed var(--line-2); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 20px; }
  .narr { font-size: 14px; line-height: 1.5; margin: 0; }
  .src-add { display: flex; gap: 12px; }

  /* the moment's dropdown (shared) */
  .mpop { position: absolute; z-index: 30; left: 12px; top: 32px; width: 340px; background: var(--surface); border-radius: 12px; box-shadow: var(--pop-shadow); padding: 12px 14px 14px; display: none; }
  .mh.open .mpop { display: block; }
  .mpop .dist { margin-top: 8px; }
  .mpop .dbar .dseg { height: 26px; }
  .mpop-row { display: flex; align-items: center; gap: 10px; }
  .mpop .from { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .mimgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .mimgs img { width: 100%; height: 66px; object-fit: cover; border-radius: 6px; display: block; }
  .sep { height: 1px; background: var(--row-line); margin: 12px -14px; }
  /* zone moodboard dropdown */
  .zpop { position: absolute; z-index: 40; right: 0; top: 50px; width: 520px; background: var(--surface); border-radius: 14px; box-shadow: var(--pop-shadow); padding: 14px 16px 16px; display: none; }
  .zhead.open .zpop { display: block; }
  .mood { columns: 4; column-gap: 8px; margin-top: 8px; }
  .mood img { width: 100%; display: block; border-radius: 6px; margin-bottom: 8px; }

  /* M1: button after the duration */
  .mbtn { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 6px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--text-3); }
  .mbtn:hover, .mh.open .mbtn { border-color: var(--line); background: var(--surface); color: var(--text); }
  .minibar { display: flex; width: 36px; height: 8px; border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
  .minibar i { display: block; height: 100%; }
  .minibar.none { box-shadow: none; border: 1px dashed var(--line-2); }
  /* M2: a colour line under the moment header */
  .mstrip { position: absolute; left: 12px; right: 12px; bottom: -3px; height: 5px; display: flex; border-radius: 3px; overflow: hidden; cursor: pointer; }
  .mstrip i { display: block; height: 100%; }
  .mstrip.none { border-top: 1.5px dashed var(--line-2); height: 0; bottom: 0; border-radius: 0; }
  .mh.m2 { cursor: pointer; }
  .mh.m2 .mpop { top: 36px; }
  /* M3: the number itself carries the palette */
  .num.pal { position: relative; cursor: pointer; padding-right: 18px; }
  .num.pal::after { content: ''; position: absolute; right: 6px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--dot, transparent); box-shadow: 0 0 0 1.5px var(--surface); }
  .num.pal.none::after { background: transparent; box-shadow: inset 0 0 0 1px var(--zc); }
  .mh.open .num.pal { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--zc); }
</style>
</head>
<body>
  <div class="topbar">
    <span class="label">Propuestas</span>
    <div class="seg" id="theme"><button data-t="light" class="on">Claro</button><button data-t="dark">Oscuro</button></div>
  </div>
  <div class="page" id="page"></div>
<script>
  const M = '/Ejemplo/Caballos%20de%20carreras.storyboard-media/';
  const PALETTE = ['#f3efe6', '#e2d9c8', '#1f2a44', '#3d5a8a', '#e8603c', '#2c2c2a', '#d9b44a'];
  const T = [60, 30, 10];
  const NAMES = { 60: 'Dominante', 30: 'Secundario', 10: 'Acento' };
  // Each bar keeps its own distribution: { 60: [...], 30: [...], 10: [...] }.
  const dists = {};
  const dist = (id, init) => (dists[id] ||= init);

  const swatch = (c, used, sm) => `<div class="sw ${sm ? 'sm' : ''} ${used ? 'used' : ''}" draggable="true" data-color="${c}" style="background:${c}"><span>${c}</span></div>`;
  const usedIn = (d) => new Set(T.flatMap((t) => d[t]));
  const segs = (id, h) => {
    const d = dists[id];
    return T.map((t) => `<div class="dseg ${d[t].length ? '' : 'empty'}" data-bar="${id}" data-t="${t} %" data-tier="${t}" style="flex:${t};height:${h}px">${d[t].length ? d[t].map((c) => `<i style="background:${c}" data-color="${c}"></i>`).join('') : `<span class="hint">Arrastra aquí</span>`}</div>`).join('');
  };
  const labels = () => `<div class="dlabels">${T.map((t) => `<div style="flex:${t}"><b>${t}</b><span class="label">${NAMES[t]}</span></div>`).join('')}</div>`;
  const minibar = (d) => (T.some((t) => d[t].length)
    ? `<span class="minibar">${T.map((t) => d[t].map((c) => `<i style="background:${c};width:${t / d[t].length}%"></i>`).join('')).join('')}</span>`
    : '<span class="minibar none"></span>');

  // ---------- part 1: the general palette ----------
  const P = {
    A: { about: '<b>A · Barra debajo.</b> Los colores en su fila, como ahora. Debajo, la barra 60/30/10 (más fina que antes, de 36 px) con los nombres bajo cada tramo. Arrastra un color de la fila a un tramo; si un tramo tiene varios, se reparten su porcentaje. Pasa el ratón por un color de la barra y la × lo quita. Los de la fila que ya están en la barra llevan un puntito.',
      render: (id) => `<div class="dist"><div class="dbar">${segs(id, 36)}</div>${labels()}</div>` },
    B: { about: '<b>B · Nombres dentro.</b> Igual, pero el porcentaje va dentro de cada tramo y la barra es un poco más alta (44 px), sin textos debajo. Más compacto.',
      render: (id) => `<div class="dist inbar"><div class="dbar">${segs(id, 44)}</div></div>` },
    C: { about: '<b>C · Una barra por grupo.</b> Tres barras finas (24 px), una por grupo, con el nombre a la izquierda. Todas del mismo largo, así que se ve qué colores hay en cada grupo pero no la proporción entre grupos.',
      render: (id) => { const d = dists[id]; return `<div class="dist stacked"><div class="dbar">${T.map((t) => `<div class="drow"><div><b style="font-size:12px">${t}</b> <span class="label">${NAMES[t]}</span></div><div class="dseg ${d[t].length ? '' : 'empty'}" data-bar="${id}" data-tier="${t}" style="height:24px">${d[t].length ? d[t].map((c) => `<i style="background:${c}" data-color="${c}"></i>`).join('') : '<span class="hint">Arrastra aquí</span>'}</div></div>`).join('')}</div></div>`; } },
  };

  // ---------- part 2: the moment dropdown ----------
  const moments = [
    { n: 1, d: '~12.0 s', shot: 'boceto-1.png', style: 'style-3.png', t: 'Imagínate que vas al hipódromo y ves a todos los caballos en fila.', imgs: ['foto-24.png', 'foto-25.png', 'style-15.png'] },
    { n: 2, d: '~2.6 s', shot: 'boceto-4.png', style: null, t: 'Así que eliges al número cuatro.', imgs: [] },
    { n: 3, d: '~6.9 s', shot: 'boceto-5.png', style: 'style-9.png', t: '¿Ganará? Pues ni idea. Al fin y al cabo, solo es un caballo que corre.', imgs: ['foto-27.png'] },
    { n: 4, d: '~8.1 s', shot: 'boceto-6.png', style: null, t: 'Resulta que acertar es bastante más difícil que elegir el más bonito.', imgs: ['foto-28.png', 'foto-29.png'] },
  ];
  const initM = [
    { 60: ['#f3efe6'], 30: ['#1f2a44'], 10: ['#e8603c'] },
    { 60: [], 30: [], 10: [] },
    { 60: ['#e2d9c8'], 30: ['#2c2c2a', '#3d5a8a'], 10: ['#d9b44a'] },
    { 60: ['#f3efe6'], 30: [], 10: [] },
  ];
  const mpop = (key, i, m) => `<div class="mpop">
      <div class="mpop-row"><span class="label">Paleta del momento ${m.n}</span><span class="link" style="margin-left:auto">copiar de la general</span></div>
      <div class="dist"><div class="dbar">${segs(key + i, 26)}</div>${labels()}</div>
      <div class="from">${PALETTE.map((c) => swatch(c, usedIn(dists[key + i]).has(c), true)).join('')}</div>
      <div class="sep"></div>
      <div class="mpop-row"><span class="label">Imágenes del momento</span><span class="link" style="margin-left:auto">+ imágenes</span></div>
      ${m.imgs.length ? `<div class="mimgs">${m.imgs.map((f) => `<img src="${M}${f}" alt="">`).join('')}</div>` : '<p class="link" style="margin:8px 0 0">Referencias de este momento: arrástralas aquí.</p>'}
    </div>`;
  const head = {
    M1: (key, i, m) => `<div class="mh" data-mh><span class="num">${m.n}</span><span class="dur">${m.d}</span><button class="mbtn" data-open>${minibar(dists[key + i])}<svg class="chev" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>${mpop(key, i, m)}</div>`,
    M2: (key, i, m) => { const d = dists[key + i]; const has = T.some((t) => d[t].length); return `<div class="mh m2" data-mh data-open><span class="num">${m.n}</span><span class="dur">${m.d}</span><span class="mstrip ${has ? '' : 'none'}">${has ? T.map((t) => d[t].map((c) => `<i style="background:${c};width:${t / d[t].length}%"></i>`).join('')).join('') : ''}</span>${mpop(key, i, m)}</div>`; },
    M3: (key, i, m) => { const d = dists[key + i]; const dot = d[10][0] || d[30][0] || d[60][0]; return `<div class="mh" data-mh><span class="num pal ${dot ? '' : 'none'}" data-open style="--dot:${dot || 'transparent'}">${m.n}</span><span class="dur">${m.d}</span>${mpop(key, i, m)}</div>`; },
  };
  const ABOUT_M = {
    M1: '<b>M1 · Botón junto a la duración.</b> A la derecha de los segundos, la mini barra de la paleta del momento (discontinua si aún no tiene). Al pulsarla se abre el desplegable: su barra 60/30/10, los colores del proyecto para arrastrar, y sus imágenes.',
    M2: '<b>M2 · Línea de color bajo el número.</b> Cada momento lleva su paleta como una línea fina bajo la cabecera, siempre a la vista (discontinua si no tiene). Clic en la cabecera para desplegar.',
    M3: '<b>M3 · El número lleva un punto.</b> Lo mínimo: el número del momento lleva un punto con su color de acento (hueco si no tiene paleta). Clic en el número para desplegar.',
  };
  const zone = (key) => `<div class="zone">
      <div class="zhead"><span class="order">1</span><span class="zname">Zona 1: intro</span><span class="zmeta">4 momentos · 29.6 s</span>
        <button class="zbtn" data-zopen><span class="thumbs">${['foto-30.png', 'style-21.png', 'foto-26.png'].map((f) => `<img src="${M}${f}" alt="">`).join('')}</span>Moodboard · 8<svg class="chev" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        <div class="zpop"><div class="mpop-row"><span class="label">Moodboard de la zona</span><span class="link" style="margin-left:auto">+ imágenes o vídeos · + palabra</span></div>
          <div class="mood">${['foto-24.png', 'style-3.png', 'foto-26.png', 'style-9.png', 'foto-28.png', 'style-15.png', 'foto-30.png', 'style-21.png'].map((f) => `<img src="${M}${f}" alt="">`).join('')}</div></div>
      </div>
      <div class="grid first"><div></div>${moments.map((m, i) => head[key](key, i, m)).join('')}</div>
      <div class="grid"><div class="rl">Boceto</div>${moments.map((m) => `<div class="cell"><img class="shot" src="${M}${m.shot}" alt=""></div>`).join('')}</div>
      <div class="grid"><div class="rl">Style frame</div>${moments.map((m) => `<div class="cell">${m.style ? `<img class="shot" src="${M}${m.style}" alt="">` : '<div class="slot">+</div>'}</div>`).join('')}</div>
      <div class="grid"><div class="rl">Narración</div>${moments.map((m) => `<div class="cell" style="height:96px"><p class="narr">${m.t}</p></div>`).join('')}</div>
      <div class="grid"><div class="rl">Fuente</div>${moments.map(() => '<div class="cell"><div class="src-add"><span class="link">+ cita</span><span class="link">+ enlace</span></div></div>').join('')}</div>
    </div>`;

  // ---------- render, keeping what is open ----------
  const open = new Set();
  function render() {
    const html = [
      `<h2>Paleta 60 / 30 / 10 en «Estilo general»</h2><p class="lead">Los colores siguen en su fila. Debajo, la distribución: arrastra cada color de la fila al grupo que le toca. Prueba a arrastrar.</p>`,
      ...Object.entries(P).map(([k, v]) => {
        const id = 'g' + k; dist(id, { 60: ['#f3efe6', '#e2d9c8'], 30: ['#1f2a44'], 10: ['#e8603c'] });
        return `<section><p class="about">${v.about}</p><div class="win"><div class="win-head">Estilo general</div><div class="sec-head"><span class="label">Colores</span><span class="link">+ color</span></div><div class="swatches">${PALETTE.map((c) => swatch(c, usedIn(dists[id]).has(c))).join('')}</div>${v.render(id)}</div></section>`;
      }),
      `<h2>Paleta e imágenes de cada momento</h2><p class="lead">Cada momento (cada número) tiene su desplegable con su paleta 60/30/10 y sus imágenes de referencia (por eso «Fuente» ya no tiene «+ imagen»). El moodboard de la zona pasa al botón de la cabecera, como Z1, y deja libre el espacio de abajo. Pulsa para abrir; puedes arrastrar colores.</p>`,
      ...['M1', 'M2', 'M3'].map((k) => { moments.forEach((_, i) => dist(k + i, JSON.parse(JSON.stringify(initM[i])))); return `<section data-sec="${k}"><p class="about">${ABOUT_M[k]}</p>${zone(k)}</section>`; }),
    ].join('');
    document.getElementById('page').innerHTML = html;
    document.querySelectorAll('[data-sec]').forEach((s) => s.querySelectorAll('[data-mh]').forEach((h, i) => { if (open.has(s.dataset.sec + i)) h.classList.add('open'); }));
    document.querySelectorAll('[data-sec]').forEach((s) => { if (open.has(s.dataset.sec + 'z')) { s.querySelector('.zhead').classList.add('open'); s.querySelector('.zbtn').classList.add('on'); } });
  }
  // Open the first moment of each version to start with.
  ['M1', 'M2', 'M3'].forEach((k) => open.add(k + '0'));
  render();

  document.addEventListener('click', (e) => {
    const zb = e.target.closest('[data-zopen]');
    if (zb) { const k = zb.closest('[data-sec]').dataset.sec + 'z'; open.has(k) ? open.delete(k) : open.add(k); render(); return; }
    const o = e.target.closest('[data-open]');
    if (o && !e.target.closest('.mpop')) {
      const h = o.closest('[data-mh]'); const s = h.closest('[data-sec]');
      const i = [...s.querySelectorAll('[data-mh]')].indexOf(h);
      const k = s.dataset.sec + i; open.has(k) ? open.delete(k) : open.add(k); render(); return;
    }
    const chip = e.target.closest('.dseg i');
    if (chip) {
      const seg = chip.closest('.dseg'); const d = dists[seg.dataset.bar]; const t = seg.dataset.tier;
      d[t] = d[t].filter((c) => c !== chip.dataset.color); render();
    }
  });
  // Drag a colour (from a palette row) onto a part of a bar.
  let dragged = null;
  document.addEventListener('dragstart', (e) => { const s = e.target.closest('.sw'); if (s) { dragged = s.dataset.color; e.dataTransfer.setData('text/plain', dragged); } });
  document.addEventListener('dragover', (e) => { const seg = e.target.closest('.dseg'); if (seg && dragged) { e.preventDefault(); document.querySelectorAll('.dseg.over').forEach((x) => x !== seg && x.classList.remove('over')); seg.classList.add('over'); } });
  document.addEventListener('dragleave', (e) => { const seg = e.target.closest('.dseg'); if (seg && !seg.contains(e.relatedTarget)) seg.classList.remove('over'); });
  document.addEventListener('drop', (e) => {
    const seg = e.target.closest('.dseg'); if (!seg || !dragged) return; e.preventDefault();
    const d = dists[seg.dataset.bar];
    T.forEach((t) => { d[t] = d[t].filter((c) => c !== dragged); });
    d[seg.dataset.tier].push(dragged);
    dragged = null; render();
  });
  document.addEventListener('dragend', () => { dragged = null; document.querySelectorAll('.dseg.over').forEach((x) => x.classList.remove('over')); });

  document.getElementById('theme').onclick = (e) => {
    const t = e.target.dataset.t; if (!t) return;
    document.documentElement.dataset.theme = t;
    document.querySelectorAll('#theme button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  };
</script>
</body>
</html>
