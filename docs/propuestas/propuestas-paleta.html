<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paleta del texto</title>
<style>
  :root {
    --bg: #ecebe5; --surface: #ffffff; --surface-2: #f6f5f1; --line: #e2e0d8; --line-2: #cfccc2;
    --text: #2c2c2a; --text-2: #5f5e5a; --text-3: #9a9890; --accent: #534ab7; --accent-soft: #eeedfe; --hover: rgba(0,0,0,.05);
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 30px rgba(0,0,0,.14);
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: var(--text);
  }
  [data-theme='dark'] {
    --bg: #303030; --surface: #242424; --surface-2: #2c2c2c; --line: #3a3a3a; --line-2: #525252;
    --text: #f0f0f0; --text-2: #c2c2c2; --text-3: #929292; --accent: #8f9bff; --accent-soft: #383c66; --hover: rgba(255,255,255,.07);
    --shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .seg { display: flex; background: var(--bg); border-radius: 9px; padding: 3px; }
  .seg button { border: none; background: transparent; padding: 5px 12px; border-radius: 7px; color: var(--text-2); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .about { flex: 1 1 100%; order: 9; color: var(--text-2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 30px 26px; padding: 26px; align-items: start; }
  .demo h3 { margin: 0 0 4px; font-size: 14px; }
  .demo > p { margin: 0 0 12px; color: var(--text-2); line-height: 1.45; min-height: 38px; }
  .note { width: 100%; max-width: 340px; padding: 12px 14px; border-radius: 4px; background: #c9e4ff; color: #2c2c2a; font-size: 14px; line-height: 1.5; box-shadow: 0 1px 4px rgba(0,0,0,.25); margin-bottom: 10px; }
  .note mark { color: inherit; background: none; padding: 0 2px; border-radius: 3px; }
  .pal { width: max-content; max-width: 100%; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .ttl { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); margin: 2px 4px 6px; }
  .sep { height: 1px; background: var(--line); margin: 8px -10px; }
  .on-ring { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent) !important; }
  .check { color: var(--accent); margin-left: auto; font-weight: 700; }
  .link { border: none; background: none; color: var(--text-3); font-size: 12px; padding: 4px; }
  .link:hover { color: var(--accent); }

  /* 1 · list with names (Notion-like), two columns */
  .v1 .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .v1 .item { display: flex; align-items: center; gap: 9px; width: 150px; padding: 4px 6px; border: none; border-radius: 6px; background: transparent; text-align: left; }
  .v1 .item:hover { background: var(--hover); }
  .v1 .ico { width: 22px; height: 22px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; box-shadow: inset 0 0 0 1px var(--line); }
  /* 2 · ready-made previews "Aa" */
  .v2 .tiles { display: grid; grid-template-columns: repeat(5, 46px); gap: 6px; }
  .v2 .tile { height: 34px; border-radius: 7px; border: none; font-weight: 700; font-size: 15px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
  /* 3 · tabs and one set of circles */
  .v3 .circles { display: grid; grid-template-columns: repeat(5, 26px); gap: 10px; padding: 4px 4px 2px; }
  .v3 .c { width: 26px; height: 26px; border-radius: 50%; border: none; box-shadow: inset 0 0 0 1px var(--line-2); }
  .v3 .seg { margin-bottom: 10px; }
  .v3 .name { display: block; margin: 8px 4px 0; font-size: 12px; color: var(--text-2); min-height: 16px; }
  /* 4 · preview on top + two rows */
  .v4 .pv { padding: 8px 10px; margin-bottom: 10px; border-radius: 8px; background: #c9e4ff; font-size: 15px; font-weight: 600; text-align: center; }
  .v4 .pv span { padding: 1px 5px; border-radius: 4px; }
  .v4 .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .v4 .row .ttl { width: 42px; margin: 0; }
  .v4 .c { width: 20px; height: 20px; border-radius: 50%; border: none; box-shadow: inset 0 0 0 1px var(--line-2); }
  .v4 .c.sq { border-radius: 5px; }
  /* 5 · ready-made pairs */
  .v5 .pairs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .v5 .pair { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; border: none; font-weight: 600; text-align: left; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .v5 .pair small { font-weight: 400; opacity: .75; margin-left: auto; font-size: 11px; }
  /* 6 · one line of dots + switch */
  .v6 .line { display: flex; align-items: center; gap: 8px; }
  .v6 .c { width: 18px; height: 18px; border-radius: 50%; border: none; box-shadow: inset 0 0 0 1px var(--line-2); }
  .v6 .c.sq { border-radius: 4px; }
  .v6 .mode { display: flex; gap: 2px; margin-left: 4px; padding-left: 8px; border-left: 1px solid var(--line); }
  .v6 .mode button { width: 26px; height: 26px; border: none; border-radius: 6px; background: transparent; font-weight: 700; }
  .v6 .mode button.on { background: var(--accent-soft); color: var(--accent); }
  .none { background: linear-gradient(135deg, transparent 45%, #e5484d 45%, #e5484d 55%, transparent 55%), var(--surface-2) !important; }
</style>
</head>
<body>
<div class="topbar">
  <b>Paleta del texto</b>
  <span style="flex:1"></span>
  <div class="seg" id="theme"><button data-t="light">Claro</button><button data-t="dark" class="on">Oscuro</button></div>
  <span class="about">Solo el elemento de los colores predefinidos (color del texto y fondo del texto), en seis disposiciones distintas y con los colores mostrados de distintas maneras. Elige colores: la frase de la nota cambia.</span>
</div>
<div class="grid" id="grid"></div>

<script>
const TEXT = [['Por defecto', null], ['Gris', '#787774'], ['Marrón', '#9f6b53'], ['Naranja', '#d9730d'], ['Amarillo', '#cb912f'], ['Verde', '#448361'], ['Azul', '#337ea9'], ['Morado', '#9065b0'], ['Rosa', '#c14c8a'], ['Rojo', '#d44c47']];
const HL = [['Sin fondo', null], ['Gris', '#e3e2e0'], ['Marrón', '#eee0da'], ['Naranja', '#fadec9'], ['Amarillo', '#fdecc8'], ['Verde', '#dbeddb'], ['Azul', '#d3e5ef'], ['Morado', '#e8deee'], ['Rosa', '#f5e0e9'], ['Rojo', '#ffe2dd']];
const INK = '#2c2c2a';
const cIn = (c) => c || INK;

const V = [
  { cls: 'v1', title: '1 · Lista con nombres', text: 'Como en Notion: dos columnas, «Texto» y «Fondo», cada color con su nombre y una muestra «A». Se lee de un vistazo qué es cada color.',
    html: (st) => `<div class="cols"><div><span class="ttl">Texto</span>${TEXT.map(([n, c], k) => `<button class="item" data-t="${k}"><span class="ico" style="color:${cIn(c)};background:#ffffff">A</span>${n}${st.t === k ? '<span class="check">✓</span>' : ''}</button>`).join('')}</div>
      <div><span class="ttl">Fondo</span>${HL.map(([n, c], k) => `<button class="item" data-h="${k}"><span class="ico ${c ? '' : 'none'}" style="background:${c || ''};color:${INK}">${c ? 'A' : ''}</span>${n}${st.h === k ? '<span class="check">✓</span>' : ''}</button>`).join('')}</div></div>` },
  { cls: 'v2', title: '2 · Muestras «Aa» de cómo queda', text: 'Cada casilla enseña ya el resultado: el texto en su color sobre su fondo. Arriba eliges si cambias el texto o el fondo.',
    html: (st) => `<div class="seg" style="margin-bottom:10px;width:max-content">${['Texto', 'Fondo'].map((m, k) => `<button class="${st.mode === k ? 'on' : ''}" data-mode="${k}">${m}</button>`).join('')}</div>
      <div class="tiles">${(st.mode ? HL : TEXT).map(([n, c], k) => `<button class="tile ${(st.mode ? st.h : st.t) === k ? 'on-ring' : ''} ${st.mode && !c ? 'none' : ''}" title="${n}" data-${st.mode ? 'h' : 't'}="${k}" style="color:${st.mode ? cIn(TEXT[st.t][1]) : cIn(c)};background:${st.mode ? (c || '') : (HL[st.h][1] || '#ffffff')}">${st.mode && !c ? '' : 'Aa'}</button>`).join('')}</div>` },
  { cls: 'v3', title: '3 · Pestañas y círculos', text: 'Una sola rejilla de círculos grandes, todos iguales. Las pestañas cambian entre color del texto y fondo; debajo, el nombre del color elegido.',
    html: (st) => `<div class="seg" style="width:max-content">${['Texto', 'Fondo'].map((m, k) => `<button class="${st.mode === k ? 'on' : ''}" data-mode="${k}">${m}</button>`).join('')}</div>
      <div class="circles">${(st.mode ? HL : TEXT).map(([n, c], k) => `<button class="c ${(st.mode ? st.h : st.t) === k ? 'on-ring' : ''} ${!c && st.mode ? 'none' : ''}" title="${n}" data-${st.mode ? 'h' : 't'}="${k}" style="background:${c || (st.mode ? '' : INK)}"></button>`).join('')}</div>
      <span class="name">${(st.mode ? HL[st.h] : TEXT[st.t])[0]}</span>` },
  { cls: 'v4', title: '4 · Vista previa arriba', text: 'Arriba se ve cómo queda la palabra con lo elegido; debajo, dos filas con etiqueta: círculos para el texto y cuadrados para el fondo.',
    html: (st) => `<div class="pv"><span style="color:${cIn(TEXT[st.t][1])};background:${HL[st.h][1] || 'transparent'}">Pedir permiso</span></div>
      <div class="row"><span class="ttl">Texto</span>${TEXT.map(([n, c], k) => `<button class="c ${st.t === k ? 'on-ring' : ''}" title="${n}" data-t="${k}" style="background:${cIn(c)}"></button>`).join('')}</div>
      <div class="row" style="margin-bottom:0"><span class="ttl">Fondo</span>${HL.map(([n, c], k) => `<button class="c sq ${st.h === k ? 'on-ring' : ''} ${c ? '' : 'none'}" title="${n}" data-h="${k}" style="background:${c || ''}"></button>`).join('')}</div>
      <div class="sep"></div><button class="link" data-reset>Quitar color y fondo</button>` },
  { cls: 'v5', title: '5 · Combinaciones listas', text: 'En vez de elegir texto y fondo por separado, combinaciones ya hechas que siempre se leen bien: el color solo, o el color sobre su fondo suave.',
    html: (st) => `<span class="ttl">Combinaciones</span><div class="pairs">${TEXT.slice(1).flatMap(([n, c], i) => [[`${n}`, i + 1, 0], [`${n} con fondo`, i + 1, i + 1]]).slice(0, 12).map(([n, t, h]) => `<button class="pair ${st.t === t && st.h === h ? 'on-ring' : ''}" data-t="${t}" data-h="${h}" style="color:${TEXT[t][1]};background:${HL[h][1] || 'var(--surface-2)'}">Aa<small style="color:${INK}">${n}</small></button>`).join('')}</div>
      <div class="sep"></div><button class="link" data-reset>Sin color</button>` },
  { cls: 'v6', title: '6 · Una línea mínima', text: 'Una sola línea de puntos pequeños. A la derecha eliges si los puntos pintan el texto (A) o el fondo (▮). Lo más pequeño posible.',
    html: (st) => `<div class="line">${(st.mode ? HL : TEXT).map(([n, c], k) => `<button class="c ${st.mode ? 'sq' : ''} ${(st.mode ? st.h : st.t) === k ? 'on-ring' : ''} ${!c && st.mode ? 'none' : ''}" title="${n}" data-${st.mode ? 'h' : 't'}="${k}" style="background:${c || (st.mode ? '' : INK)}"></button>`).join('')}
      <span class="mode"><button class="${st.mode === 0 ? 'on' : ''}" data-mode="0" title="Color del texto">A</button><button class="${st.mode === 1 ? 'on' : ''}" data-mode="1" title="Fondo del texto">▮</button></span></div>` },
];

const grid = document.getElementById('grid');
V.forEach((v) => {
  const st = { t: 0, h: 0, mode: 0 };
  const el = document.createElement('section');
  el.className = `demo ${v.cls}`;
  grid.appendChild(el);
  const render = () => {
    el.innerHTML = `<h3>${v.title}</h3><p>${v.text}</p>
      <div class="note">Hay que <mark style="color:${cIn(TEXT[st.t][1])};background:${HL[st.h][1] || 'transparent'};font-weight:600">pedir permiso</mark> para las imágenes del hipódromo</div>
      <div class="pal">${v.html(st)}</div>`;
  };
  el.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (d.mode != null) st.mode = +d.mode;
    if (d.t != null) st.t = +d.t;
    if (d.h != null) st.h = +d.h;
    if (d.reset != null) { st.t = 0; st.h = 0; }
    render();
  });
  render();
});
document.querySelectorAll('#theme button').forEach((b) => b.onclick = () => { document.documentElement.dataset.theme = b.dataset.t; document.querySelectorAll('#theme button').forEach((x) => x.classList.toggle('on', x === b)); });
</script>
</body>
</html>
