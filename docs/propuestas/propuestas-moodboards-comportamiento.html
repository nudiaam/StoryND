<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Comportamiento de los moodboards</title>
<style>
  :root {
    --bg: #ecebe5; --surface: #ffffff; --line: #e2e0d8; --line-2: #cfccc2;
    --text: #2c2c2a; --text-2: #5f5e5a; --text-3: #9a9890; --accent: #534ab7; --tile: #efece4; --zone: #ffffff;
    --chip: rgba(255,255,255,.94); --word-bg: #fff8d6; --danger: #d64545; --board: #e4e2da;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08); --shadow-lg: 0 10px 30px rgba(0,0,0,.22);
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: var(--text);
  }
  [data-theme='dark'] {
    --bg: #303030; --surface: #242424; --line: #3a3a3a; --line-2: #525252;
    --text: #f0f0f0; --text-2: #c2c2c2; --text-3: #929292; --accent: #8f9bff; --tile: #343434; --zone: #1d1d1d;
    --chip: rgba(29,29,29,.92); --word-bg: #3a3620; --board: #2a2a2a; --shadow: 0 6px 22px rgba(0,0,0,.35); --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  button { font: inherit; color: var(--text); cursor: pointer; }
  .topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .seg { display: flex; background: var(--bg); border-radius: 9px; padding: 3px; }
  .seg button { border: none; background: transparent; padding: 5px 12px; border-radius: 7px; color: var(--text-2); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .about { flex: 1 1 100%; order: 9; color: var(--text-2); line-height: 1.45; }
  .lbl { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
  .reset { border: 1px solid var(--line-2); background: transparent; border-radius: 8px; padding: 4px 10px; color: var(--text-2); font-size: 12px; }

  /* the app, in small: top strip, the board with its windows, side strip */
  .app { display: flex; flex-direction: column; gap: 0; margin: 16px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--board); }
  .topstrip { background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 14px 10px; }
  .topstrip .holder { max-height: 210px; overflow-y: auto; overflow-x: hidden; scrollbar-gutter: stable; }
  .main { display: flex; align-items: stretch; }
  .board { flex: 1; padding: 22px; display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start;
    background-image: radial-gradient(var(--line-2) 1px, transparent 1px); background-size: 24px 24px; }
  .sidestrip { flex: none; width: 260px; background: var(--surface); border-left: 1px solid var(--line); padding: 10px 12px 16px; }
  .win { background: var(--zone); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 18px 18px; }
  .win h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; color: var(--text-2); border-bottom: 1px solid var(--line-2); padding-bottom: 10px; }
  .zone { background: var(--zone); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 16px 16px; border-top: 4px solid #6aa36f; }
  .zone .zhead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .zone .zhead b { font-size: 14px; }
  .zone .zchip { margin-left: auto; font-size: 12px; color: var(--text-2); background: var(--bg); border-radius: 8px; padding: 3px 8px; }
  .zpop { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 12px 16px 16px; }
  .mhead { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  .mhead span:not(.lbl) { font-size: 11.5px; color: var(--text-3); }
  .grid { position: relative; }
  .where { font-size: 11px; color: var(--text-3); margin-top: 8px; }

  .tile { position: absolute; border-radius: 6px; overflow: hidden; background: var(--tile); cursor: grab; user-select: none; touch-action: none; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .tile.word { display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px 8px; background: var(--word-bg); font-weight: 600; font-size: 11.5px; line-height: 1.3; }
  .tile.placeholder { background: transparent; border: 2px dashed var(--accent); }
  .tile.placeholder > * { visibility: hidden; }
  .badge { position: absolute; left: 5px; top: 5px; font-size: 10px; padding: 1px 6px; border-radius: 8px; background: rgba(0,0,0,.7); color: #fff; }
  .ctl { position: absolute; top: 4px; width: 18px; height: 18px; padding: 0; border: none; border-radius: 50%; background: transparent; color: var(--text-2);
    opacity: 0; visibility: hidden; transition: opacity .12s, visibility 0s linear .12s; z-index: 3; }
  .ctl svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.22)); }
  .ctl circle { fill: var(--chip); transition: fill .12s; }
  .ctl path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ctl.x { right: 4px; } .ctl.rot { right: 25px; }
  .ctl.x:hover circle { fill: var(--danger); } .ctl.x:hover { color: #fff; }
  .span-handle { position: absolute; right: 3px; bottom: 3px; width: 14px; height: 14px; z-index: 3; cursor: nwse-resize; opacity: 0; visibility: hidden;
    border-right: 3px solid rgba(255,255,255,.95); border-bottom: 3px solid rgba(255,255,255,.95); border-radius: 0 0 4px 0; filter: drop-shadow(0 0 1px rgba(0,0,0,.6)); transition: opacity .12s, visibility 0s linear .12s; }
  .tile.word .span-handle { border-color: rgba(44,44,42,.55); filter: none; }
  .tile:hover > :is(.ctl, .span-handle), .tile.resizing > .span-handle { opacity: 1; visibility: visible; transition: opacity .12s .2s, visibility 0s linear .2s; }
  .sorting .tile > :is(.ctl, .span-handle) { visibility: hidden !important; }
  body.resizing, body.resizing * { cursor: nwse-resize !important; }
  .ghost { position: fixed; z-index: 90; pointer-events: none; border-radius: 6px; overflow: hidden; opacity: .9; box-shadow: var(--shadow-lg); background: var(--tile); }
  .ghost img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ghost.word { display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px 8px; background: var(--word-bg); font-weight: 600; font-size: 11.5px; }
</style>
</head>
<body>
<div class="topbar">
  <b>Moodboards · cómo colocar y escalar</b>
  <span style="flex:1"></span>
  <div class="seg" id="mode"><button data-m="cols" class="on">Columnas</button><button data-m="rows">Filas</button><button data-m="grid">Columnas y filas</button></div>
  <div class="seg" id="theme"><button data-t="light" class="on">Claro</button><button data-t="dark">Oscuro</button></div>
  <span class="about" id="about"></span>
</div>
<div class="app">
  <div class="topstrip"><div class="mhead"><span class="lbl">Franja arriba · Estilo general</span></div><div class="holder"><div class="grid" data-c="top"></div></div></div>
  <div class="main">
    <div class="board">
      <div class="win" data-w="win"><h3>Ventana 5 (ventana separada)</h3><div class="mhead"><span class="lbl">Moodboard</span><span>+ imágenes o vídeos</span><span>+ palabra</span></div><div class="grid" data-c="win"></div></div>
      <div class="win" data-w="fotos"><h3>Estilo general</h3><div class="mhead"><span class="lbl">Fotos</span><span>+ imágenes o vídeos</span><span>+ palabra</span></div><div class="grid" data-c="fotos"></div></div>
      <div class="zone" data-w="zone">
        <div class="zhead"><b>Zona 3: línea genealógica</b><span class="zchip">Moodboard · 8 ▾</span></div>
        <div class="zpop"><div class="mhead"><span class="lbl">Moodboard de la zona</span><span>+ imágenes o vídeos</span></div><div class="grid" data-c="zone"></div></div>
      </div>
    </div>
    <aside class="sidestrip"><div class="mhead"><span class="lbl">Franja lateral · Estilo general</span></div><div class="grid" data-c="side"></div></aside>
  </div>
</div>
<div style="margin: 0 16px 40px"><button class="reset" id="reset">Volver a empezar</button></div>

<script>
const M = '/Ejemplo/Caballos%20de%20carreras.storyboard-media/';
const yt = 'https://i.ytimg.com/vi/jNQXAC9IVRw/hqdefault.jpg';
const POOL = [
  { id: 'a', src: M + 'foto-28.png', ar: 1.524 }, { id: 'b', src: M + 'foto-29.png', ar: 0.667 }, { id: 'c', word: 'inquietante' },
  { id: 'd', src: yt, ar: 1.778, video: true }, { id: 'e', src: M + 'foto-30.png', ar: 1 }, { id: 'f', word: 'polvo y luz' },
  { id: 'g', src: M + 'foto-27.png', ar: 0.714 }, { id: 'h', src: M + 'foto-25.png', ar: 1.6 }, { id: 'i', src: M + 'style-9.png', ar: 1.6 },
  { id: 'j', src: M + 'foto-24.png', ar: 0.667 }, { id: 'k', src: M + 'fuente-10.png', ar: 1.5 }, { id: 'l', src: M + 'foto-26.png', ar: 1 },
];
const byId = Object.fromEntries(POOL.map((it) => [it.id, it]));
const arOf = (it) => (it.word ? 1.8 : it.ar);

// Where pictures live: their width on screen and their gap, as in the app.
const C = {
  top: { w: 0, gap: 6, ids: 'abcdefghijkl', name: 'franja arriba' },
  side: { w: 234, gap: 6, ids: 'abcdefgh', name: 'franja lateral' },
  win: { w: 420, gap: 8, ids: 'ijklabe', name: 'ventana separada' },
  fotos: { w: 420, gap: 8, ids: 'abcdefgh', name: 'Fotos del Estilo general' },
  zone: { w: 380, gap: 8, ids: 'hgfedcba', name: 'moodboard de zona' },
};
const MODES = {
  cols: 'Columnas, como el tablero ahora: las imágenes van una debajo de otra; la esquina cambia el ancho de esa imagen, a saltos pequeños; las demás se recolocan alrededor. Se ve la imagen entera.',
  rows: 'Filas, como la franja lateral ahora: todas las de una fila a la misma altura; la esquina hace más alta o más baja toda su fila, a saltos; la que deja de caber baja a la fila siguiente. Se ve la imagen entera.',
  grid: 'Columnas y filas (cuadrícula): una rejilla de casillas. Al arrastrar, la imagen va a las casillas que tiene debajo; si hay otras, bajan para dejarle sitio, y todo sube para no dejar huecos (así cabe debajo de otra si hay sitio). La esquina cambia por separado cuántas casillas ocupa de ancho y de alto. Para llenar su recuadro, la imagen se recorta un poco (como un mosaico).',
};
let mode = 'cols';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- the three layouts ----------
// Columns: as many as fit at ~72 px, each split in 4 thin ones.
const colsOf = (c) => Math.max(4, Math.floor((c.w + c.gap) / (72 + c.gap))) * 4;
function layCols(c, list) {
  const cols = colsOf(c), cw = (c.w - c.gap * (cols - 1)) / cols;
  const hts = new Array(cols).fill(0), rects = {};
  for (const e of list) {
    const span = clamp(e.fcs, 2, cols);
    let best = 0, top = Infinity;
    if (e.fcol != null) { best = clamp(e.fcol, 0, cols - span); top = Math.max(...hts.slice(best, best + span)); }
    else for (let k = 0; k + span <= cols; k++) { const t = Math.max(...hts.slice(k, k + span)); if (t < top - 0.5) { top = t; best = k; } }
    const w = cw * span + c.gap * (span - 1), h = w / arOf(byId[e.id]);
    rects[e.id] = { x: best * (cw + c.gap), y: top, w, h, span, col: best };
    for (let k = best; k < best + span; k++) hts[k] = top + h + c.gap;
  }
  return { rects, height: list.length ? Math.max(...hts) - c.gap : 0, step: cw + c.gap, cols };
}
// Rows: each row its own height; what doesn't fit goes down.
const ROW_STEP = 14;
const rowH0 = (c) => Math.round(clamp(c.w * 0.3, 70, 104));
function layRows(c, list, hs) {
  const rects = {};
  let i = 0, k = 0, y = 0;
  while (i < list.length) {
    const H = hs[k] ?? rowH0(c);
    let x = 0, rh = 0;
    while (i < list.length) {
      const ar = arOf(byId[list[i].id]), w = Math.min(ar * H, c.w);
      if (x > 0 && x + w > c.w + 0.5) break;
      rects[list[i].id] = { x, y, w, h: w / ar, row: k };
      x += w + c.gap; rh = Math.max(rh, w / ar); i++;
    }
    y += rh + c.gap; k++;
  }
  return { rects, height: list.length ? y - c.gap : 0 };
}
// Grid: square cells (three per column); each item takes cw × ch cells, the
// first free place in reading order.
const gridCols = (c) => Math.max(4, Math.floor((c.w + c.gap) / (72 + c.gap))) * 3;
const cellOf = (c) => (c.w - c.gap * (gridCols(c) - 1)) / gridCols(c);
// Never narrower than ~50 px.
const minCw = (c) => { for (let k = 1; k <= gridCols(c); k++) if (k * cellOf(c) + (k - 1) * c.gap >= 50) return k; return 1; };
// Each item has its own cells: column gx, row gy, cw wide, ch tall.
function layGrid(c, list) {
  const cell = cellOf(c), step = cell + c.gap, rects = {};
  let bottom = 0;
  for (const e of list) {
    rects[e.id] = { x: e.gx * step, y: e.gy * step, w: e.cw * cell + (e.cw - 1) * c.gap, h: e.ch * cell + (e.ch - 1) * c.gap };
    bottom = Math.max(bottom, rects[e.id].y + rects[e.id].h);
  }
  return { rects, height: bottom, cell, step, cols: gridCols(c) };
}
const hits = (a, b) => a.gx < b.gx + b.cw && b.gx < a.gx + a.cw && a.gy < b.gy + b.ch && b.gy < a.gy + a.ch;
// `fixed` keeps the cells it was given; whatever it lands on moves down
// below it; then everything rises as far as it can, so no gaps are left
// (only where nothing fits).
function settle(c, list, fixed) {
  const cols = gridCols(c);
  const items = list.map((e) => ({ ...e, cw: clamp(e.cw, 1, cols) })).map((e) => ({ ...e, gx: clamp(e.gx, 0, cols - e.cw), gy: Math.max(0, e.gy) }));
  const placed = [];
  const first = items.find((e) => e.id === fixed);
  if (first) placed.push(first);
  const rest = items.filter((e) => e.id !== fixed).sort((a, b) => a.gy - b.gy || a.gx - b.gx);
  for (const e of rest) {
    let hit;
    while ((hit = placed.find((p) => hits(p, e)))) e.gy = hit.gy + hit.ch;
    placed.push(e);
  }
  // Rise, top ones first.
  const done = [];
  for (const e of placed.slice().sort((a, b) => a.gy - b.gy || a.gx - b.gx)) {
    while (e.gy > 0 && !done.some((p) => hits(p, { ...e, gy: e.gy - 1 }))) e.gy -= 1;
    done.push(e);
  }
  return list.map((e) => done.find((d) => d.id === e.id));
}
// First free cells in reading order, for the starting layout.
function pack(c, list) {
  const cols = gridCols(c), out = [];
  for (const e of list) {
    const cw = clamp(e.cw, 1, cols);
    let at = null;
    for (let r = 0; !at; r++) for (let k = 0; k + cw <= cols && !at; k++) if (!out.some((p) => hits(p, { gx: k, gy: r, cw, ch: e.ch }))) at = [k, r];
    out.push({ ...e, cw, gx: at[0], gy: at[1] });
  }
  return out;
}

// ---------- state, per place and per mode ----------
const state = {};
function reset() {
  for (const [key, c] of Object.entries(C)) {
    const ids = [...c.ids];
    // Starting size: half the strip, a third of a window, ~120 px up top.
    const target = key === 'top' ? 120 : c.w < 300 ? (c.w - c.gap) / 2 : (c.w - 2 * c.gap) / 3;
    const cstep = (c.w - c.gap * (colsOf(c) - 1)) / colsOf(c) + c.gap;
    const fcs = clamp(Math.round((target + c.gap) / cstep), 2, colsOf(c));
    const ghalf = clamp(Math.round((target + c.gap) / (cellOf(c) + c.gap)), minCw(c), gridCols(c));
    state[key] = {
      cols: ids.map((id) => ({ id, fcs, fcol: null })),
      rows: { list: ids.map((id) => ({ id })), hs: [] },
      grid: pack(c, ids.map((id) => ({ id, cw: ghalf, ch: Math.max(minCw(c), Math.round((ghalf * cellOf(c) + (ghalf - 1) * c.gap) / arOf(byId[id]) / (cellOf(c) + c.gap))) }))),
    };
  }
}
function layoutOf(key, list) {
  const c = C[key], s = state[key];
  if (mode === 'cols') return layCols(c, list || s.cols);
  if (mode === 'rows') return layRows(c, list || s.rows.list, s.rows.hs);
  return layGrid(c, list || s.grid);
}
const listOf = (key) => (mode === 'cols' ? state[key].cols : mode === 'rows' ? state[key].rows.list : state[key].grid);
function setList(key, list) {
  if (mode === 'cols') state[key].cols = list;
  else if (mode === 'rows') state[key].rows.list = list;
  else state[key].grid = list;
}

// ---------- drawing (same elements kept) ----------
const ICON = {
  x: '<svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="9"/><path d="M6.2 6.2l5.6 5.6M11.8 6.2l-5.6 5.6"/></svg>',
  rot: '<svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="9"/><path d="M12.6 8.6a3.7 3.7 0 1 1-1.1-2.7M12.8 4.6v2.6h-2.6"/></svg>',
};
function makeTile(it) {
  const el = document.createElement('div');
  el.className = 'tile' + (it.word ? ' word' : '');
  el.dataset.id = it.id;
  el.innerHTML = (it.word ? `<span>${it.word}</span>` : `<img src="${it.src}" alt="">${it.video ? '<span class="badge">▶ YouTube</span>' : ''}`)
    + `<button class="ctl x" data-act="x">${ICON.x}</button>` + (it.word ? '' : `<button class="ctl rot">${ICON.rot}</button>`)
    + '<span class="span-handle" data-act="handle"></span>';
  return el;
}
function draw(key, lay, { placeholder = null, resizing = null } = {}) {
  const grid = document.querySelector(`.grid[data-c="${key}"]`);
  grid.style.width = C[key].w + 'px';
  grid.style.height = lay.height + 'px';
  const keep = new Set();
  for (const [id, r] of Object.entries(lay.rects)) {
    keep.add(id);
    let el = grid.querySelector(`.tile[data-id="${id}"]`);
    if (!el) { el = makeTile(byId[id]); grid.appendChild(el); }
    Object.assign(el.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
    el.classList.toggle('placeholder', placeholder === id);
    el.classList.toggle('resizing', resizing === id);
  }
  grid.querySelectorAll('.tile').forEach((el) => { if (!keep.has(el.dataset.id)) el.remove(); });
}
const render = (key, opts) => draw(key, layoutOf(key), opts);
function renderAll() {
  C.top.w = Math.max(500, document.querySelector('.topstrip .holder').clientWidth);
  // A narrower place: pictures that no longer fit move in.
  if (mode === 'grid') for (const key of Object.keys(C)) state[key].grid = settle(C[key], state[key].grid, null);
  for (const key of Object.keys(C)) render(key);
  document.getElementById('about').textContent = MODES[mode] + ' Todo es para probar con el ratón: arrastra una imagen para moverla, arrastra su esquina (abajo a la derecha, al dejar el ratón encima) para escalarla. Cada sitio va por libre.';
}

// ---------- moving ----------
function startMoveGrid(key, id, ev) {
  const c = C[key];
  const grid = document.querySelector(`.grid[data-c="${key}"]`);
  const tile = ev.target.closest('.tile').getBoundingClientRect();
  const grab = { x: ev.clientX - tile.left, y: ev.clientY - tile.top };
  const origin = { x: ev.clientX, y: ev.clientY };
  const start = state[key].grid;
  const me = start.find((e) => e.id === id);
  let active = false, ghost = null, result = null;
  const move = (m) => {
    if (!active && Math.hypot(m.clientX - origin.x, m.clientY - origin.y) < 5) return;
    const it = byId[id];
    if (!active) {
      active = true;
      grid.classList.add('sorting');
      ghost = document.createElement('div');
      ghost.className = 'ghost' + (it.word ? ' word' : '');
      ghost.innerHTML = it.word ? it.word : `<img src="${it.src}" alt="">`;
      Object.assign(ghost.style, { width: tile.width + 'px', height: tile.height + 'px' });
      document.body.appendChild(ghost);
    }
    ghost.style.left = m.clientX - grab.x + 'px';
    ghost.style.top = m.clientY - grab.y + 'px';
    // The cells under the picture in the hand (its top left corner, rounded).
    const g = grid.getBoundingClientRect();
    const step = cellOf(c) + c.gap;
    const gx = clamp(Math.round((m.clientX - grab.x - g.left) / step), 0, gridCols(c) - me.cw);
    const gy = Math.max(0, Math.round((m.clientY - grab.y - g.top) / step));
    result = settle(c, start.map((e) => (e.id === id ? { ...e, gx, gy } : e)), id);
    draw(key, layGrid(c, result), { placeholder: id });
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    grid.classList.remove('sorting');
    ghost?.remove();
    if (active && result) state[key].grid = result;
    render(key);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

function startMove(key, id, ev) {
  if (mode === 'grid') { startMoveGrid(key, id, ev); return; }
  const c = C[key];
  const grid = document.querySelector(`.grid[data-c="${key}"]`);
  const tile = ev.target.closest('.tile').getBoundingClientRect();
  const grab = { x: ev.clientX - tile.left, y: ev.clientY - tile.top };
  const origin = { x: ev.clientX, y: ev.clientY };
  const list = listOf(key);
  const lay0 = layoutOf(key);
  const me = list.find((e) => e.id === id);
  // Columns: everything else keeps the column it is in now.
  const others = list.filter((e) => e.id !== id).map((e) => (mode === 'cols' ? { ...e, fcol: lay0.rects[e.id].col } : e));
  const base = layoutOf(key, others);
  let active = false, ghost = null, result = null;
  const move = (m) => {
    if (!active && Math.hypot(m.clientX - origin.x, m.clientY - origin.y) < 5) return;
    const it = byId[id];
    if (!active) {
      active = true;
      grid.classList.add('sorting');
      ghost = document.createElement('div');
      ghost.className = 'ghost' + (it.word ? ' word' : '');
      ghost.innerHTML = it.word ? it.word : `<img src="${it.src}" alt="">`;
      document.body.appendChild(ghost);
    }
    const g = grid.getBoundingClientRect();
    const px = m.clientX - g.left, py = m.clientY - g.top;
    let at = others.length, mine = me;
    if (mode === 'cols') {
      const col = clamp(Math.round((px - grab.x + tile.width / 2) / base.step - me.fcs / 2), 0, base.cols - me.fcs);
      for (let i = 0; i < others.length; i++) {
        const r = base.rects[others[i].id];
        if (r.col < col + me.fcs && col < r.col + r.span && r.y + r.h / 2 > py) { at = i; break; }
      }
      mine = { ...me, fcol: col };
    } else {
      // Before the first item of the band under the pointer whose middle is to its right.
      const band = others.filter((e) => { const r = base.rects[e.id]; return py >= r.y - c.gap && py <= r.y + r.h + c.gap; });
      if (band.length) {
        const next = band.find((e) => base.rects[e.id].x + base.rects[e.id].w / 2 > px);
        at = next ? others.indexOf(next) : others.indexOf(band[band.length - 1]) + 1;
      } else if (py < 0) at = 0;
      else at = others.findIndex((e) => base.rects[e.id].y > py);
      if (at < 0) at = others.length;
    }
    result = others.slice();
    result.splice(at, 0, mine);
    const lay = layoutOf(key, result);
    draw(key, lay, { placeholder: id });
    // In the hand: the size it will have there.
    const r = lay.rects[id];
    const k = r.w / tile.width;
    Object.assign(ghost.style, { width: r.w + 'px', height: r.h + 'px', left: m.clientX - grab.x * k + 'px', top: m.clientY - grab.y * (r.h / tile.height) + 'px' });
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    grid.classList.remove('sorting');
    ghost?.remove();
    if (active && result) {
      if (mode === 'cols') {
        const lay = layCols(c, result);
        setList(key, result.map((e) => ({ ...e, fcol: lay.rects[e.id].col })));
      } else setList(key, result);
    }
    render(key);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

// ---------- the corner ----------
function startResize(key, id, ev) {
  const c = C[key];
  const x0 = ev.clientX, y0 = ev.clientY;
  const r0 = layoutOf(key).rects[id];
  const ar = arOf(byId[id]);
  document.body.classList.add('resizing');
  const s = state[key];
  const hs0 = s.rows.hs.slice();
  const move = (m) => {
    const dx = m.clientX - x0, dy = m.clientY - y0;
    if (mode === 'cols') {
      const lay = layCols(c, s.cols);
      const e = s.cols.find((x) => x.id === id);
      const span = clamp(Math.round((r0.w + dx + c.gap) / lay.step), 2, lay.cols);
      if (span === e.fcs) return;
      e.fcs = span;
    } else if (mode === 'rows') {
      const H0 = hs0[r0.row] ?? rowH0(c);
      const want = (r0.h * (r0.w + dx)) / r0.w;
      const H = clamp(H0 + Math.round((want - H0) / ROW_STEP) * ROW_STEP, 36, c.w / ar);
      if (H === (s.rows.hs[r0.row] ?? rowH0(c))) return;
      for (let k = 0; k < r0.row; k++) s.rows.hs[k] ??= rowH0(c);
      s.rows.hs[r0.row] = H;
    } else {
      const e = s.grid.find((x) => x.id === id);
      const step = cellOf(c) + c.gap;
      const cw = clamp(Math.round((r0.w + dx + c.gap) / step), minCw(c), gridCols(c) - e.gx);
      const ch = Math.max(minCw(c), Math.round((r0.h + dy + c.gap) / step));
      if (cw === e.cw && ch === e.ch) return;
      // What it grows over moves down; what it leaves free rises.
      s.grid = settle(c, s.grid.map((x) => (x.id === id ? { ...x, cw, ch } : x)), id);
    }
    render(key, { resizing: id });
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    document.body.classList.remove('resizing');
    render(key);
  };
  render(key, { resizing: id });
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

for (const key of Object.keys(C)) {
  const grid = document.querySelector(`.grid[data-c="${key}"]`);
  grid.addEventListener('pointerdown', (ev) => {
    if (ev.button !== 0) return;
    const t = ev.target.closest('.tile');
    if (!t) return;
    if (ev.target.closest('[data-act="handle"]')) { ev.preventDefault(); ev.stopPropagation(); startResize(key, t.dataset.id, ev); return; }
    if (ev.target.closest('button')) return;
    ev.preventDefault();
    startMove(key, t.dataset.id, ev);
  });
  grid.addEventListener('click', (ev) => {
    const t = ev.target.closest('.tile');
    if (!t || !ev.target.closest('[data-act="x"]')) return;
    setList(key, listOf(key).filter((e) => e.id !== t.dataset.id));
    if (mode === 'grid') state[key].grid = settle(C[key], state[key].grid, null);
    render(key);
  });
}
document.querySelectorAll('#mode button').forEach((b) => b.onclick = () => {
  mode = b.dataset.m;
  document.querySelectorAll('#mode button').forEach((x) => x.classList.toggle('on', x === b));
  renderAll();
});
document.querySelectorAll('#theme button').forEach((b) => b.onclick = () => {
  document.documentElement.dataset.theme = b.dataset.t;
  document.querySelectorAll('#theme button').forEach((x) => x.classList.toggle('on', x === b));
});
document.getElementById('reset').onclick = () => { reset(); renderAll(); };
C.top.w = Math.max(500, document.querySelector('.topstrip .holder').clientWidth);
reset();
renderAll();
window.addEventListener('resize', renderAll);
</script>
</body>
</html>
