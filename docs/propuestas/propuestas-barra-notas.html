<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Barra de las notas</title>
<style>
  :root {
    --bg: #ecebe5; --surface: #ffffff; --surface-2: #f6f5f1; --line: #e2e0d8; --line-2: #cfccc2;
    --text: #2c2c2a; --text-2: #5f5e5a; --text-3: #9a9890; --accent: #534ab7; --accent-soft: #eeedfe;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 30px rgba(0,0,0,.14); --hover: rgba(0,0,0,.05);
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: var(--text);
  }
  [data-theme='dark'] {
    --bg: #303030; --surface: #242424; --surface-2: #2c2c2c; --line: #3a3a3a; --line-2: #525252;
    --text: #f0f0f0; --text-2: #c2c2c2; --text-3: #929292; --accent: #8f9bff; --accent-soft: #383c66;
    --shadow: 0 10px 30px rgba(0,0,0,.5); --hover: rgba(255,255,255,.07);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; background-image: radial-gradient(var(--line-2) 1px, transparent 1px); background-size: 24px 24px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .seg { display: flex; background: var(--bg); border-radius: 9px; padding: 3px; }
  .seg button { border: none; background: transparent; padding: 5px 12px; border-radius: 7px; color: var(--text-2); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .about { flex: 1 1 100%; order: 9; color: var(--text-2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 36px 28px; padding: 28px; }
  .demo h3 { margin: 0 0 4px; font-size: 14px; }
  .demo > p { margin: 0 0 70px; color: var(--text-2); line-height: 1.45; max-width: 420px; min-height: 38px; }
  .stage { position: relative; padding-top: 6px; }

  /* the note */
  .note { width: 260px; min-height: 130px; padding: 14px; border-radius: 4px; color: #2c2c2a; font-size: 14px; line-height: 1.45; box-shadow: 0 1px 4px rgba(0,0,0,.25); outline: 2px solid var(--accent); outline-offset: 2px; }
  .note b { font-weight: 700; }

  /* toolbar shell shared by all versions */
  .bar { position: absolute; left: 0; bottom: calc(100% + 12px); display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); border: 1px solid var(--line); white-space: nowrap; }
  .tb { width: 30px; height: 30px; padding: 0; border: none; border-radius: 7px; background: transparent; color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; position: relative; }
  .tb:hover { background: var(--hover); color: var(--text); }
  .tb.on { background: var(--accent-soft); color: var(--accent); }
  .tb.wide { width: auto; padding: 0 8px; gap: 5px; }
  .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .chev { width: 10px; height: 10px; color: var(--text-3); }
  .A { font-weight: 700; font-size: 14px; line-height: 1; padding-bottom: 2px; border-bottom: 3px solid var(--ac, var(--text)); }

  /* menus */
  .menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 5; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); display: none; }
  .menu.open { display: block; }
  .menu .title { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); margin: 2px 2px 6px; }
  .menu .title + .row { margin-bottom: 10px; }
  .row { display: flex; gap: 6px; }
  .row:last-child { margin-bottom: 0 !important; }
  .sw { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
  .sw.sq { border-radius: 6px; }
  .sw.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
  .sw.none { background: linear-gradient(135deg, transparent 45%, #e5484d 45%, #e5484d 55%, transparent 55%), var(--surface-2) !important; }
  .aa { width: 26px; height: 26px; padding: 0; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 13px; }
  .aa.on { box-shadow: 0 0 0 2px var(--accent); }
  .opt { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: none; border-radius: 7px; background: transparent; color: var(--text); text-align: left; }
  .opt:hover { background: var(--hover); }
  .opt.on { color: var(--accent); }
  /* inline drawer (version 4) */
  .drawer { position: absolute; left: 0; bottom: calc(100% + 54px); display: none; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .drawer.open { display: flex; gap: 14px; align-items: center; }
  .drawer .title { margin: 0 4px 0 0; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
</style>
</head>
<body>
<div class="topbar">
  <b>Barra de las notas</b>
  <span style="flex:1"></span>
  <div class="seg" id="theme"><button data-t="light">Claro</button><button data-t="dark" class="on">Oscuro</button></div>
  <span class="about">La barra que sale al seleccionar una nota, en cinco disposiciones. Todas funcionan: cambia el color de la nota, la alineación, la negrita y cursiva, y el color o fondo del texto.</span>
</div>
<div class="grid" id="grid"></div>

<script>
const NOTE = ['#fff1a8', '#ffd8a8', '#ffc9de', '#e5d4ff', '#c9e4ff', '#c8f0d8', '#ececec', '#ffffff'];
const TEXT = [['Por defecto', '#2c2c2a'], ['Gris', '#787774'], ['Marrón', '#9f6b53'], ['Naranja', '#d9730d'], ['Amarillo', '#cb912f'], ['Verde', '#448361'], ['Azul', '#337ea9'], ['Morado', '#9065b0'], ['Rosa', '#c14c8a'], ['Rojo', '#d44c47']];
const HL = [['Sin fondo', 'transparent'], ['Gris', '#e3e2e0'], ['Marrón', '#eee0da'], ['Naranja', '#fadec9'], ['Amarillo', '#fdecc8'], ['Verde', '#dbeddb'], ['Azul', '#d3e5ef'], ['Morado', '#e8deee'], ['Rosa', '#f5e0e9'], ['Rojo', '#ffe2dd']];
const ICON = {
  left: '<svg viewBox="0 0 20 20"><path d="M4 5h12M4 9h8M4 13h12M4 17h8"/></svg>',
  center: '<svg viewBox="0 0 20 20"><path d="M4 5h12M6 9h8M4 13h12M6 17h8"/></svg>',
  right: '<svg viewBox="0 0 20 20"><path d="M4 5h12M8 9h8M4 13h12M8 17h8"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 20 20"><path d="M5.5 8l4.5 4.5L14.5 8"/></svg>',
};
const B = '<b style="font-size:14px">B</b>';
const I = '<i style="font-family:Georgia,serif;font-size:15px">I</i>';

const VERSIONS = [
  { title: '1 · Compacta', text: 'Cada grupo es un solo botón: el color de la nota abre sus colores, la alineación cambia con un clic, y «A» abre texto y fondo. La barra queda muy corta.',
    bar: (st) => `
      <button class="tb" data-menu="note" title="Color de la nota"><span class="dot" style="background:${st.note}"></span></button>
      <span class="sep"></span>
      <button class="tb" data-act="cycle" title="Alineación">${ICON[st.align]}</button>
      <button class="tb ${st.b ? 'on' : ''}" data-act="b">${B}</button>
      <button class="tb ${st.i ? 'on' : ''}" data-act="i">${I}</button>
      <span class="sep"></span>
      <button class="tb" data-menu="text" title="Color del texto"><span class="A" style="--ac:${st.color}">A</span></button>
      <div class="menu" data-for="note"><div class="row">${NOTE.map((c) => `<button class="sw ${c === st.note ? 'on' : ''}" style="background:${c}" data-note="${c}"></button>`).join('')}</div></div>
      <div class="menu" data-for="text" style="left:150px"><span class="title">Texto</span><div class="row">${TEXT.map(([n, c]) => `<button class="sw ${c === st.color ? 'on' : ''}" title="${n}" style="background:${c}" data-color="${c}"></button>`).join('')}</div><span class="title">Fondo</span><div class="row">${HL.map(([n, c]) => `<button class="sw sq ${c === st.hl ? 'on' : ''} ${c === 'transparent' ? 'none' : ''}" title="${n}" style="background:${c}" data-hl="${c}"></button>`).join('')}</div></div>` },
  { title: '2 · Grupos con menú', text: 'Botones con nombre y flecha, como en un procesador de textos: «Nota», alineación, formato y «Color». Cada uno abre su menú. Más claro de leer, algo más ancha.',
    bar: (st) => `
      <button class="tb wide" data-menu="note"><span class="dot" style="background:${st.note};width:14px;height:14px"></span>Nota${ICON.chev}</button>
      <span class="sep"></span>
      <button class="tb wide" data-menu="align">${ICON[st.align]}${ICON.chev}</button>
      <span class="sep"></span>
      <button class="tb ${st.b ? 'on' : ''}" data-act="b">${B}</button>
      <button class="tb ${st.i ? 'on' : ''}" data-act="i">${I}</button>
      <span class="sep"></span>
      <button class="tb wide" data-menu="text"><span class="A" style="--ac:${st.color}">A</span>${ICON.chev}</button>
      <div class="menu" data-for="note"><div class="row">${NOTE.map((c) => `<button class="sw ${c === st.note ? 'on' : ''}" style="background:${c}" data-note="${c}"></button>`).join('')}</div></div>
      <div class="menu" data-for="align" style="left:90px;width:150px">${['left', 'center', 'right'].map((a) => `<button class="opt ${a === st.align ? 'on' : ''}" data-align="${a}">${ICON[a]}${{ left: 'Izquierda', center: 'Centro', right: 'Derecha' }[a]}</button>`).join('')}</div>
      <div class="menu" data-for="text" style="left:190px"><span class="title">Color del texto</span><div class="row">${TEXT.map(([n, c]) => `<button class="aa ${c === st.color ? 'on' : ''}" title="${n}" style="color:${c}" data-color="${c}">A</button>`).join('')}</div><span class="title">Fondo</span><div class="row">${HL.map(([n, c]) => `<button class="aa ${c === st.hl ? 'on' : ''} ${c === 'transparent' ? 'sw none' : ''}" title="${n}" style="background:${c};color:#2c2c2a" data-hl="${c}">${c === 'transparent' ? '' : 'A'}</button>`).join('')}</div></div>` },
  { title: '3 · Un solo menú de color', text: 'Todos los colores juntos en un único botón: el de la nota, el del texto y el del fondo, en tres filas. La barra solo tiene color, alineación y formato.',
    bar: (st) => `
      <button class="tb wide" data-menu="all" title="Colores"><span class="dot" style="background:${st.note};width:16px;height:16px"></span><span class="A" style="--ac:${st.color};font-size:13px">A</span>${ICON.chev}</button>
      <span class="sep"></span>
      ${['left', 'center', 'right'].map((a) => `<button class="tb ${a === st.align ? 'on' : ''}" data-align="${a}">${ICON[a]}</button>`).join('')}
      <span class="sep"></span>
      <button class="tb ${st.b ? 'on' : ''}" data-act="b">${B}</button>
      <button class="tb ${st.i ? 'on' : ''}" data-act="i">${I}</button>
      <div class="menu" data-for="all"><span class="title">Nota</span><div class="row">${NOTE.map((c) => `<button class="sw ${c === st.note ? 'on' : ''}" style="background:${c}" data-note="${c}"></button>`).join('')}</div><span class="title">Texto</span><div class="row">${TEXT.map(([n, c]) => `<button class="sw ${c === st.color ? 'on' : ''}" title="${n}" style="background:${c}" data-color="${c}"></button>`).join('')}</div><span class="title">Fondo del texto</span><div class="row">${HL.map(([n, c]) => `<button class="sw sq ${c === st.hl ? 'on' : ''} ${c === 'transparent' ? 'none' : ''}" title="${n}" style="background:${c}" data-hl="${c}"></button>`).join('')}</div></div>` },
  { title: '4 · Colores en una segunda fila', text: 'La barra es corta y, al pulsar un color, se abre una segunda fila justo encima con las muestras, sin ventana flotante aparte.',
    bar: (st) => `
      <button class="tb" data-drawer="note" title="Color de la nota"><span class="dot" style="background:${st.note}"></span></button>
      <button class="tb" data-drawer="text" title="Color del texto"><span class="A" style="--ac:${st.color}">A</span></button>
      <button class="tb" data-drawer="hl" title="Fondo del texto"><span style="padding:1px 4px;border-radius:4px;background:${st.hl === 'transparent' ? 'var(--surface-2)' : st.hl};color:#2c2c2a;font-weight:700">A</span></button>
      <span class="sep"></span>
      ${['left', 'center', 'right'].map((a) => `<button class="tb ${a === st.align ? 'on' : ''}" data-align="${a}">${ICON[a]}</button>`).join('')}
      <span class="sep"></span>
      <button class="tb ${st.b ? 'on' : ''}" data-act="b">${B}</button>
      <button class="tb ${st.i ? 'on' : ''}" data-act="i">${I}</button>`,
    drawers: (st) => ({
      note: `<span class="title">Nota</span><div class="row">${NOTE.map((c) => `<button class="sw ${c === st.note ? 'on' : ''}" style="background:${c}" data-note="${c}"></button>`).join('')}</div>`,
      text: `<span class="title">Texto</span><div class="row">${TEXT.map(([n, c]) => `<button class="sw ${c === st.color ? 'on' : ''}" title="${n}" style="background:${c}" data-color="${c}"></button>`).join('')}</div>`,
      hl: `<span class="title">Fondo</span><div class="row">${HL.map(([n, c]) => `<button class="sw sq ${c === st.hl ? 'on' : ''} ${c === 'transparent' ? 'none' : ''}" title="${n}" style="background:${c}" data-hl="${c}"></button>`).join('')}</div>`,
    }) },
  { title: '5 · Como ahora, ordenada', text: 'La misma idea de ahora, pero con las muestras de la nota recogidas en un botón y la paleta de texto con círculos del mismo tamaño que todo lo demás, en dos filas alineadas.',
    bar: (st) => `
      <button class="tb wide" data-menu="note" title="Color de la nota"><span class="dot" style="background:${st.note}"></span>${ICON.chev}</button>
      <span class="sep"></span>
      ${['left', 'center', 'right'].map((a) => `<button class="tb ${a === st.align ? 'on' : ''}" data-align="${a}">${ICON[a]}</button>`).join('')}
      <span class="sep"></span>
      <button class="tb ${st.b ? 'on' : ''}" data-act="b">${B}</button>
      <button class="tb ${st.i ? 'on' : ''}" data-act="i">${I}</button>
      <span class="sep"></span>
      <button class="tb wide" data-menu="text" title="Color y fondo del texto"><span class="A" style="--ac:${st.color}">A</span>${ICON.chev}</button>
      <div class="menu" data-for="note"><div class="row">${NOTE.map((c) => `<button class="sw ${c === st.note ? 'on' : ''}" style="background:${c}" data-note="${c}"></button>`).join('')}</div></div>
      <div class="menu" data-for="text" style="left:210px"><span class="title">Texto</span><div class="row">${TEXT.map(([n, c]) => `<button class="sw ${c === st.color ? 'on' : ''}" title="${n}" style="background:${c}" data-color="${c}"></button>`).join('')}</div><span class="title">Fondo</span><div class="row">${HL.map(([n, c]) => `<button class="sw ${c === st.hl ? 'on' : ''} ${c === 'transparent' ? 'none' : ''}" title="${n}" style="background:${c}" data-hl="${c}"></button>`).join('')}</div></div>` },
];

const grid = document.getElementById('grid');
VERSIONS.forEach((v, k) => {
  const st = { note: '#c9e4ff', color: '#2c2c2a', hl: 'transparent', align: 'left', b: false, i: false, open: null };
  const el = document.createElement('section');
  el.className = 'demo';
  grid.appendChild(el);
  const render = () => {
    const drawers = v.drawers ? v.drawers(st) : null;
    el.innerHTML = `<h3>${v.title}</h3><p>${v.text}</p><div class="stage">
      ${drawers ? `<div class="drawer ${st.open ? 'open' : ''}">${st.open ? drawers[st.open] : ''}</div>` : ''}
      <div class="bar">${v.bar(st)}</div>
      <div class="note" style="background:${st.note};text-align:${st.align}"><span style="color:${st.color};background:${st.hl};font-weight:${st.b ? 700 : 400};font-style:${st.i ? 'italic' : 'normal'};padding:0 2px;border-radius:3px">Pedir permiso para las imágenes del hipódromo</span></div></div>`;
    if (st.open) el.querySelector(`.menu[data-for="${st.open}"]`)?.classList.add('open');
  };
  el.addEventListener('click', (e) => {
    const t = e.target.closest('button');
    if (!t) { st.open = null; render(); return; }
    const d = t.dataset;
    if (d.menu) st.open = st.open === d.menu ? null : d.menu;
    else if (d.drawer) st.open = st.open === d.drawer ? null : d.drawer;
    else if (d.act === 'b') st.b = !st.b;
    else if (d.act === 'i') st.i = !st.i;
    else if (d.act === 'cycle') st.align = { left: 'center', center: 'right', right: 'left' }[st.align];
    else if (d.align) { st.align = d.align; if (st.open === 'align') st.open = null; }
    else if (d.note) { st.note = d.note; if (!v.drawers) st.open = null; }
    else if (d.color) st.color = d.color;
    else if (d.hl) st.hl = d.hl;
    render();
  });
  render();
});
document.querySelectorAll('#theme button').forEach((b) => b.onclick = () => { document.documentElement.dataset.theme = b.dataset.t; document.querySelectorAll('#theme button').forEach((x) => x.classList.toggle('on', x === b)); });
</script>
</body>
</html>
