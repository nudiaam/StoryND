<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paleta 60/30/10 y zona</title>
<style>
  :root {
    --bg: #ecebe5; --surface: #ffffff; --surface-2: #faf9f6; --line: #e2e0d8; --line-2: #cfccc2;
    --text: #2c2c2a; --text-2: #5f5e5a; --text-3: #9a9890; --accent: #534ab7; --accent-soft: #eeedfe;
    --row-line: rgba(44,44,42,.08); --tile: #efece4; --zone-base: #ffffff; --chip-bg: rgba(255,255,255,.92);
    --zone-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08); --pop-shadow: 0 2px 6px rgba(0,0,0,.08), 0 20px 50px rgba(0,0,0,.2);
    --ink-mix: #2c2c2a; --hover: rgba(0,0,0,.04);
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: var(--text);
  }
  [data-theme='dark'] {
    --bg: #303030; --surface: #242424; --surface-2: #2a2a2a; --line: #3a3a3a; --line-2: #525252;
    --text: #f0f0f0; --text-2: #c2c2c2; --text-3: #929292; --accent: #8f9bff; --accent-soft: #383c66;
    --row-line: rgba(255,255,255,.07); --tile: #343434; --zone-base: #1d1d1d; --chip-bg: rgba(29,29,29,.92);
    --zone-shadow: 0 6px 22px rgba(0,0,0,.35); --pop-shadow: 0 20px 50px rgba(0,0,0,.6); --ink-mix: #f0f0f0; --hover: rgba(255,255,255,.05);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .seg { display: flex; background: var(--bg); border-radius: 9px; padding: 3px; }
  .seg button { border: none; background: transparent; padding: 5px 12px; border-radius: 7px; color: var(--text-2); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .page { padding: 28px 32px 80px; display: flex; flex-direction: column; gap: 28px; }
  h2 { margin: 8px 0 0; font-size: 17px; }
  .lead { margin: -16px 0 0; color: var(--text-2); max-width: 760px; line-height: 1.5; }
  .about { color: var(--text-2); line-height: 1.5; max-width: 760px; margin: 0 0 14px; }
  .about b { color: var(--text); }
  .label { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
  .link { font-size: 12px; color: var(--text-3); cursor: pointer; }
  .link:hover { color: var(--accent); }

  /* the general window, as in the app */
  .win { width: 600px; border-radius: 16px; background: var(--zone-base); box-shadow: var(--zone-shadow); padding: 0 18px 20px; }
  .win-head { height: 56px; display: flex; align-items: center; border-bottom: 2px solid var(--line-2); font-size: 18px; font-weight: 600; }
  .sec-head { display: flex; align-items: center; gap: 14px; height: 36px; margin-top: 8px; }

  /* swatch, as in the app */
  .sw { position: relative; width: 64px; height: 64px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); display: flex; align-items: flex-end; padding: 5px; flex: none; }
  .sw span { font-size: 10.5px; background: var(--chip-bg); padding: 0 5px; border-radius: 4px; color: var(--text-2); }
  .sw.sm { width: 40px; height: 40px; padding: 3px; }
  .sw.sm span { display: none; }
  .add { width: 64px; height: 64px; border-radius: 8px; border: 1.5px dashed var(--line-2); background: transparent; color: var(--text-3); font-size: 20px; flex: none; }
  .add.sm { width: 40px; height: 40px; font-size: 16px; }
  .add:hover { color: var(--accent); border-color: var(--accent); }

  /* P1 rows */
  .tier { display: grid; grid-template-columns: 112px 1fr; align-items: center; column-gap: 12px; padding: 8px 0; }
  .tier + .tier { border-top: 1px solid var(--row-line); }
  .tier-name { display: flex; flex-direction: column; gap: 2px; }
  .tier-name b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tier-name small { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
  .tier-sw { display: flex; gap: 8px; flex-wrap: wrap; }
  .bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); margin: 4px 0 10px; }
  .bar i { display: block; height: 100%; }

  /* P2 big bar */
  .bigbar { display: flex; gap: 6px; height: 96px; margin-top: 6px; }
  .seg-col { display: flex; flex-direction: column; gap: 6px; }
  .seg-fill { flex: 1; display: flex; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .seg-fill i { flex: 1; display: flex; align-items: flex-end; padding: 5px; }
  .seg-fill i span { font-size: 10.5px; background: var(--chip-bg); padding: 0 5px; border-radius: 4px; color: var(--text-2); font-style: normal; }
  .seg-foot { display: flex; align-items: baseline; gap: 6px; height: 18px; }
  .seg-foot b { font-variant-numeric: tabular-nums; }
  .seg-foot .link { margin-left: auto; }

  /* P3 columns */
  .cols { display: flex; gap: 8px; margin-top: 6px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .col-head { display: flex; align-items: baseline; gap: 6px; }
  .col-head b { font-variant-numeric: tabular-nums; }
  .stack { height: 150px; display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .stack i { flex: 1; display: flex; align-items: center; padding: 0 6px; }
  .stack i span { font-size: 10.5px; background: var(--chip-bg); padding: 0 5px; border-radius: 4px; color: var(--text-2); font-style: normal; }
  .col .link { text-align: left; }

  /* P4 rows + sample */
  .p4 { display: grid; grid-template-columns: 1fr 190px; gap: 18px; align-items: start; }
  .p4 .tier { grid-template-columns: 92px 1fr; }
  .sample { position: relative; height: 124px; border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .sample .s2 { position: absolute; left: 0; bottom: 0; width: 64%; height: 46%; border-radius: 0 40px 0 0; }
  .sample .s2b { position: absolute; right: 14px; top: 14px; width: 44px; height: 44px; border-radius: 50%; }
  .sample .s3 { position: absolute; right: 14px; bottom: 16px; width: 46px; height: 8px; border-radius: 4px; }
  .sample-cap { font-size: 11px; color: var(--text-3); margin-top: 6px; }

  /* ---------- zone mock ---------- */
  .zone { --zc: #e8603c; position: relative; width: 980px; border-radius: 16px; background: color-mix(in srgb, var(--zc) 4%, var(--zone-base)); box-shadow: var(--zone-shadow); padding-bottom: 18px; }
  .zhead { position: relative; height: 56px; margin: 0 18px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--zc); }
  .order { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 7px; background: var(--zc); color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .zname { font-size: 18px; font-weight: 600; color: color-mix(in srgb, var(--zc) 55%, var(--ink-mix)); }
  .zmeta { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
  .moments { display: flex; gap: 26px; padding: 14px 18px 0 128px; position: relative; }
  .labels { position: absolute; left: 18px; top: 48px; display: flex; flex-direction: column; gap: 112px; }
  .labels span { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: color-mix(in srgb, var(--zc) 45%, var(--text-3)); }
  .mom { width: 250px; display: flex; flex-direction: column; gap: 12px; }
  .mom-h { display: flex; align-items: center; gap: 8px; height: 24px; }
  .num { min-width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: color-mix(in srgb, var(--zc) 20%, transparent); color: var(--zc); }
  .dur { font-size: 12px; color: var(--text-3); }
  .mom img { width: 200px; height: 125px; object-fit: cover; border-radius: 6px; display: block; }
  .mom p { margin: 4px 0 0; font-size: 14px; line-height: 1.5; }

  /* the dropdown panel (shared) */
  .pop { position: absolute; z-index: 20; background: var(--surface); border-radius: 14px; box-shadow: var(--pop-shadow); padding: 14px 16px 16px; display: none; }
  .open .pop { display: block; }
  .pop-row { display: flex; align-items: center; gap: 10px; }
  .pop .tier { grid-template-columns: 88px 1fr; padding: 6px 0; }
  .mood { columns: 3; column-gap: 8px; margin-top: 8px; }
  .mood img { width: 100%; display: block; border-radius: 6px; margin-bottom: 8px; break-inside: avoid; }
  .mood.four { columns: 4; }

  /* Z1: button in the header */
  .zbtn { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); font-size: 12.5px; }
  .zbtn:hover, .open .zbtn { border-color: var(--zc); color: var(--text); }
  .minibar { display: flex; width: 44px; height: 10px; border-radius: 5px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
  .minibar i { display: block; height: 100%; }
  .chev { width: 10px; height: 10px; transition: transform .15s; }
  .open .chev { transform: rotate(180deg); }
  .z1 .pop { right: 0; top: 50px; width: 470px; }

  /* Z2: colour strip under the title + tab */
  .z2 .zhead { border-bottom: none; }
  .zstrip { position: absolute; left: 0; right: 0; bottom: -4px; display: flex; height: 6px; border-radius: 3px; overflow: hidden; }
  .zstrip i { display: block; height: 100%; }
  .ztab { position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%); z-index: 21; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 10px; border-radius: 0 0 9px 9px; border: none; background: color-mix(in srgb, var(--zc) 14%, var(--zone-base)); color: color-mix(in srgb, var(--zc) 60%, var(--ink-mix)); font-size: 11.5px; font-weight: 600; }
  .z2 .pop { left: 0; right: 0; top: 58px; border-radius: 0 0 14px 14px; padding-top: 30px; }
  .z2 .pop-grid { display: grid; grid-template-columns: 360px 1fr; gap: 24px; }

  /* Z3: hanging tab under the title */
  .ztab3 { position: absolute; left: 0; top: 56px; z-index: 21; display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border-radius: 0 0 9px 9px; border: none; background: var(--zc); color: #fff; font-size: 11.5px; font-weight: 600; }
  .dots { display: inline-flex; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--zc); margin-left: -3px; }
  .dots i:first-child { margin-left: 0; }
  .z3 .pop { left: 0; top: 82px; width: 430px; border-top-left-radius: 0; }
  .z3 .moments { padding-top: 40px; }
</style>
</head>
<body>
  <div class="topbar">
    <span class="label">Propuestas</span>
    <div class="seg" id="theme"><button data-t="light" class="on">Claro</button><button data-t="dark">Oscuro</button></div>
  </div>
  <div class="page" id="page"></div>
<script>
  const M = '/Ejemplo/Caballos%20de%20carreras.storyboard-media/';
  const P = { 60: ['#f3efe6', '#e2d9c8'], 30: ['#1f2a44', '#3d5a8a'], 10: ['#e8603c'] };
  const Z = { 60: ['#faf4ea'], 30: ['#2c2c2a', '#7a6f63'], 10: ['#d93a23'] };
  const NAMES = { 60: 'Dominante', 30: 'Secundario', 10: 'Acento' };
  const sw = (c, sm) => `<div class="sw ${sm ? 'sm' : ''}" style="background:${c}"><span>${c}</span></div>`;
  const bar = (pal, cls = 'bar') => `<div class="${cls}">${[60, 30, 10].map((t) => pal[t].map((c) => `<i style="background:${c};width:${t / pal[t].length}%"></i>`).join('')).join('')}</div>`;
  const rows = (pal, sm) => [60, 30, 10].map((t) => `<div class="tier"><div class="tier-name"><b>${t} %</b><small>${NAMES[t]}</small></div><div class="tier-sw">${pal[t].map((c) => sw(c, sm)).join('')}<button class="add ${sm ? 'sm' : ''}">+</button></div></div>`).join('');
  const head = '<div class="win-head">Estilo general</div><div class="sec-head"><span class="label">Colores</span></div>';
  const imgs = ['foto-24.png', 'style-3.png', 'foto-26.png', 'style-9.png', 'foto-28.png', 'style-15.png', 'foto-29.png', 'style-21.png'];
  const mood = (n, cls = '') => `<div class="mood ${cls}">${imgs.slice(0, n).map((f) => `<img src="${M}${f}" alt="">`).join('')}</div>`;
  const zoneBody = `<div class="moments"><div class="labels"><span>Boceto</span><span>Narración</span></div>
    ${[['boceto-1.png', 'Imagínate que vas al hipódromo y ves a todos los caballos en fila.', '~12.0 s'], ['boceto-4.png', 'Así que eliges al número cuatro.', '~2.6 s'], ['boceto-5.png', '¿Ganará? Pues ni idea. Al fin y al cabo, solo es un caballo que corre.', '~6.9 s']]
      .map(([b, t, d], i) => `<div class="mom"><div class="mom-h"><span class="num">${i + 1}</span><span class="dur">${d}</span></div><img src="${M}${b}" alt=""><p>${t}</p></div>`).join('')}</div>`;
  const zname = '<span class="order">1</span><span class="zname">Zona 1: intro</span><span class="zmeta">12 momentos · 1:36 min</span>';
  const chev = '<svg class="chev" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  const zonePalette = `<div class="pop-row"><span class="label">Paleta de la zona</span><span class="link" style="margin-left:auto">usar la general</span></div>${bar(Z)}${rows(Z, true)}
    <div class="pop-row" style="margin-top:10px"><span class="label">Moodboard de la zona</span><span class="link" style="margin-left:auto">+ imágenes</span></div>`;

  const parts = [
    ['h', 'Paleta 60 / 30 / 10 en «Estilo general»', 'Dominante (60 %), secundario (30 %) y acento (10 %), con varios colores en cada uno. Como ahora: clic en un color para cambiarlo, arrastrar para ordenarlo, y también para pasarlo de un grupo a otro.'],
    ['P1', '<b>P1 · Filas.</b> Una fila por grupo con su porcentaje, y arriba una barra que muestra el reparto real (cada grupo ocupa su porcentaje, repartido entre sus colores). Lo más claro para editar.',
      `<div class="win">${head}${bar(P)}${rows(P)}</div>`],
    ['P2', '<b>P2 · Barra proporcional.</b> La paleta es directamente la proporción: un bloque grande dividido 60/30/10, y cada bloque se reparte entre sus colores. «+» debajo de cada uno. Se lee de un vistazo, como una muestra de color.',
      `<div class="win">${head}<div class="bigbar">${[60, 30, 10].map((t) => `<div class="seg-col" style="flex:${t}"><div class="seg-fill">${P[t].map((c) => `<i style="background:${c}"><span>${c}</span></i>`).join('')}</div><div class="seg-foot"><b>${t}</b><span class="label">${NAMES[t]}</span><span class="link">+</span></div></div>`).join('')}</div></div>`],
    ['P3', '<b>P3 · Columnas 6 : 3 : 1.</b> Tres columnas con anchos proporcionales; los colores de cada grupo se apilan dentro. Ocupa poco alto y la proporción sigue a la vista.',
      `<div class="win">${head}<div class="cols">${[60, 30, 10].map((t) => `<div class="col" style="flex:${t}"><div class="col-head"><b>${t}</b><span class="label">${NAMES[t]}</span></div><div class="stack">${P[t].map((c) => `<i style="background:${c}"><span>${c}</span></i>`).join('')}</div><span class="link">+ color</span></div>`).join('')}</div></div>`],
    ['P4', '<b>P4 · Filas + muestra.</b> Las filas de P1 en pequeño y, al lado, una mini composición pintada con la paleta (fondo dominante, formas secundarias, un toque de acento) para ver cómo funciona junta.',
      `<div class="win">${head}<div class="p4"><div>${rows(P, true)}</div><div><div class="sample" style="background:${P[60][0]}"><div class="s2" style="background:${P[30][0]}"></div><div class="s2b" style="background:${P[30][1]}"></div><div class="s3" style="background:${P[10][0]}"></div></div><div class="sample-cap">Así se reparte en una imagen</div></div></div></div>`],
    ['h', 'Desplegable de cada zona', 'Cada zona tiene su paleta (con la misma distribución) y su moodboard, en un desplegable que se abre desde arriba y se pone encima de los momentos. Pulsa para abrirlo y cerrarlo.'],
    ['Z1', '<b>Z1 · Botón en la cabecera.</b> A la derecha del título, un botón con la mini barra de la paleta de la zona. Se abre un panel bajo la cabecera, alineado a la derecha.',
      `<div class="zone z1" style="height:640px"><div class="zhead">${zname}<button class="zbtn" data-toggle>${bar(Z, 'minibar')}Paleta y moodboard${chev}</button><div class="pop">${zonePalette}${mood(6)}</div></div>${zoneBody}</div>`],
    ['Z2', '<b>Z2 · Tira de color + pestaña.</b> La línea bajo el título pasa a ser la paleta de la zona (60/30/10), siempre a la vista. Una pestaña centrada la despliega a todo el ancho de la zona: paleta a la izquierda, moodboard a la derecha.',
      `<div class="zone z2" style="height:420px"><div class="zhead">${zname}${bar(Z, 'zstrip')}<button class="ztab" data-toggle>Paleta y moodboard ${chev}</button><div class="pop"><div class="pop-grid"><div>${zonePalette.replace(/<div class="pop-row" style="margin-top:10px">.*$/s, '')}</div><div><div class="pop-row"><span class="label">Moodboard de la zona</span><span class="link" style="margin-left:auto">+ imágenes</span></div>${mood(8, 'four')}</div></div></div></div>${zoneBody}</div>`],
    ['Z3', '<b>Z3 · Pestaña colgante.</b> Una pestaña del color de la zona cuelga bajo el título, con los colores en puntitos y cuántas imágenes tiene. El panel sale pegado a ella, a la izquierda.',
      `<div class="zone z3" style="height:640px"><div class="zhead">${zname}<button class="ztab3" data-toggle><span class="dots">${[...Z[60], ...Z[30], ...Z[10]].map((c) => `<i style="background:${c}"></i>`).join('')}</span>Paleta · 6 imágenes ${chev}</button><div class="pop">${zonePalette}${mood(6)}</div></div>${zoneBody}</div>`],
  ];
  document.getElementById('page').innerHTML = parts.map(([k, a, b]) => (k === 'h'
    ? `<h2>${a}</h2><p class="lead">${b}</p>`
    : `<section><p class="about">${a}</p>${b}</section>`)).join('');
  document.querySelectorAll('[data-toggle]').forEach((b) => { b.onclick = () => b.closest('.zone').classList.toggle('open'); });
  document.querySelectorAll('.zone').forEach((z) => z.classList.add('open'));
  document.getElementById('theme').onclick = (e) => {
    const t = e.target.dataset.t; if (!t) return;
    document.documentElement.dataset.theme = t;
    document.querySelectorAll('#theme button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  };
</script>
</body>
</html>
