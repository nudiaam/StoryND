<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Secciones del momento</title>
<style>
  :root {
    --bg: #ecebe5; --surface: #ffffff; --line: #e2e0d8; --line-2: #cfccc2;
    --text: #2c2c2a; --text-2: #5f5e5a; --text-3: #9a9890; --accent: #534ab7; --accent-soft: #eeedfe; --style: #7f77dd;
    --tr-bg: #fbf1dc; --tr-ink: #7a4e0b; --tr-line: #e7c98c; --row-line: rgba(44,44,42,.08); --tile: #efece4;
    --zone-base: #ffffff; --zone-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08); --card: #f6f5f1; --card-2: #efede7;
    --zc: #d85a30; --hover: rgba(0,0,0,.04);
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: var(--text);
  }
  [data-theme='dark'] {
    --bg: #303030; --surface: #242424; --line: #3a3a3a; --line-2: #525252;
    --text: #f0f0f0; --text-2: #c2c2c2; --text-3: #929292; --accent: #8f9bff; --accent-soft: #383c66; --style: #8f9bff;
    --tr-bg: #3d3420; --tr-ink: #f2cd8f; --tr-line: #806633; --row-line: rgba(255,255,255,.07); --tile: #343434;
    --zone-base: #1d1d1d; --zone-shadow: 0 6px 22px rgba(0,0,0,.35); --card: #262626; --card-2: #2c2c2c; --hover: rgba(255,255,255,.05);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .seg { display: flex; background: var(--bg); border-radius: 9px; padding: 3px; }
  .seg button { border: none; background: transparent; padding: 5px 12px; border-radius: 7px; color: var(--text-2); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .about { flex: 1 1 100%; color: var(--text-2); line-height: 1.45; }
  .about b { color: var(--text); }
  .stage { padding: 32px; overflow-x: auto; }

  /* the zone around the moments */
  .zone { display: inline-block; width: max-content; position: relative; border-radius: 16px; background: color-mix(in srgb, var(--zc) 4%, var(--zone-base)); box-shadow: var(--zone-shadow); padding: 0 24px 24px; }
  .zhead { height: 56px; display: flex; align-items: center; gap: 12px; border-bottom: 2px solid color-mix(in srgb, var(--zc) 70%, transparent); margin: 0 -24px 0; padding: 0 24px; }
  .order { width: 26px; height: 26px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--zc) 22%, transparent); color: var(--zc); font-weight: 700; }
  .zname { font-size: 18px; font-weight: 600; color: color-mix(in srgb, var(--zc) 55%, var(--text)); }
  .meta { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }

  /* shared pieces */
  .num { min-width: 24px; height: 22px; padding: 0 6px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: color-mix(in srgb, var(--zc) 20%, transparent); color: var(--zc); }
  .dur { font-size: 12px; color: var(--text-3); }
  .img { display: block; flex: none; border-radius: 6px; background: var(--tile); object-fit: cover; }
  .img.style { box-shadow: 0 0 0 2px var(--style); }
  .slot { border: 1.5px dashed var(--line-2); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 20px; }
  .pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; border: 1px dashed var(--line-2); color: var(--text-3); font-size: 12px; white-space: nowrap; }
  .tr { display: inline-block; max-width: 140px; padding: 3px 9px; border-radius: 10px; background: var(--tr-bg); border: 1px dashed var(--tr-line); color: var(--tr-ink); font-size: 12px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .narr { font-size: 14px; line-height: 1.5; }
  .narr.big { font-size: 15.5px; line-height: 1.5; font-weight: 500; }
  .cita { font-size: 12.5px; line-height: 1.4; font-style: italic; color: var(--text-2); }
  .cita b { font-style: normal; font-weight: 600; color: var(--text-3); font-size: 11.5px; }
  .link { font-size: 12.5px; color: var(--accent); text-decoration: none; }
  .adds { display: flex; gap: 10px; font-size: 12px; color: var(--text-3); }
  .lab { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: color-mix(in srgb, var(--zc) 45%, var(--text-3)); }

  /* ---------- A · actual ---------- */
  .A { display: grid; grid-template-columns: 92px repeat(3, auto); column-gap: 26px; }
  .A .labels { display: grid; grid-template-rows: 34px 150px 70px 150px 150px 120px; }
  .A .labels div { padding-top: 12px; border-top: 1px solid var(--row-line); font-size: 12px; color: color-mix(in srgb, var(--zc) 45%, var(--text-3)); }
  .A .labels div:first-child { border: none; }
  .A .m { display: grid; grid-template-rows: 34px 150px 70px 150px 150px 120px; min-width: 250px; }
  .A .m > div { border-top: 1px solid var(--row-line); padding: 0 12px; display: flex; align-items: center; gap: 16px; }
  .A .m > .h { border: none; gap: 8px; }
  .A .m > .t { position: relative; }
  .A .m > .n { align-items: flex-start; padding-top: 10px; }
  .A .m > .s { flex-direction: column; align-items: flex-start; justify-content: flex-start; padding-top: 12px; gap: 6px; }

  /* ---------- B · aire, sin líneas ---------- */
  .B { display: grid; grid-template-columns: 96px repeat(3, auto); column-gap: 40px; padding-top: 18px; }
  .B .labels, .B .m { display: grid; grid-template-rows: 30px 136px 34px 136px auto auto; row-gap: 18px; }
  .B .labels .lab { padding-top: 4px; }
  .B .m { min-width: 230px; }
  .B .m > div { display: flex; align-items: center; gap: 18px; }
  .B .m > .h { gap: 8px; }
  .B .m > .t { justify-content: flex-start; gap: 18px; }
  .B .m > .n { align-items: flex-start; max-width: 260px; }
  .B .m > .s { flex-direction: column; align-items: flex-start; gap: 6px; }
  .B .m > .sf { align-items: center; }

  /* ---------- C · tarjetas ---------- */
  .C { display: flex; gap: 20px; align-items: stretch; padding-top: 20px; }
  .C .m { width: max-content; min-width: 290px; background: var(--card); border-radius: 12px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 14px; }
  .C .narr { max-width: 360px; }
  .C .h .tr { margin-left: auto; }
  .C .h { display: flex; align-items: center; gap: 8px; }
  .C .pics { display: flex; gap: 12px; align-items: flex-start; }
  .C figure { margin: 0; display: flex; flex-direction: column; gap: 5px; }
  .C figcaption { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
  .C .between { display: flex; align-items: center; }
  .C .foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--row-line); display: flex; flex-direction: column; gap: 8px; }
  .C .gap { display: flex; align-items: center; justify-content: center; width: 0; position: relative; }
  .C .gap .tr { position: absolute; top: 90px; transform: translateX(-50%); left: 0; z-index: 2; }

  /* ---------- D · texto primero ---------- */
  .D { display: flex; gap: 36px; padding-top: 20px; }
  .D .m { width: 270px; display: flex; flex-direction: column; gap: 14px; }
  .D .m.wide { width: 440px; }
  .D .h { display: flex; align-items: center; gap: 8px; }
  .D .narr.big { min-height: 72px; }
  .D .pics { position: relative; display: flex; gap: 12px; }
  .D .sf-mini { position: absolute; right: -10px; bottom: -14px; }
  .D .src { display: flex; flex-direction: column; gap: 6px; padding-left: 10px; border-left: 2px solid var(--row-line); }
  .D .trs { display: flex; gap: 12px; min-height: 24px; }

  /* ---------- E · lado a lado ---------- */
  .E { display: flex; flex-direction: column; gap: 14px; padding-top: 20px; }
  .E .m { display: grid; grid-template-columns: 30px auto 300px; column-gap: 20px; padding: 12px 0; border-top: 1px solid var(--row-line); }
  .E .m:first-child { border-top: none; }
  .E .col-img { display: flex; flex-direction: column; gap: 10px; }
  .E .row-img { display: flex; align-items: center; gap: 14px; }
  .E .col-txt { display: flex; flex-direction: column; gap: 10px; }
  .E .tr-cut { display: flex; justify-content: center; padding: 2px 0 0 50px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="seg" id="variants">
      <button data-v="A">A · Actual</button>
      <button data-v="B">B · Aire, sin líneas</button>
      <button data-v="C">C · Tarjetas</button>
      <button data-v="D">D · Texto primero</button>
      <button data-v="E">E · Lado a lado</button>
    </div>
    <div class="seg" id="theme">
      <button data-t="light">Claro</button>
      <button data-t="dark">Oscuro</button>
    </div>
    <div class="about" id="about"></div>
  </div>
  <div class="stage"><div class="zone" id="zone"></div></div>
<script>
  const M = '/Ejemplo/Caballos%20de%20carreras.storyboard-media/';
  const img = (f, w, h, cls = '') => `<img class="img ${cls}" src="${M}${f}" style="width:${w}px;height:${h}px" alt="">`;
  // Three moments: complete, almost empty, with an image source.
  const data = [
    { n: 1, dur: '~6.5 s', shots: ['boceto-1.png', 'boceto-2.png'], cut: 'Corte seco', style: 'style-3.png',
      narr: 'Imagínate que vas al hipódromo y ves a los caballos por primera vez. Sin ningún contexto, eliges al más bonito.',
      src: { cita: '«El 70 % de las apuestas se hacen por el nombre del caballo»', who: 'Informe Hipódromo 2024' }, out: 'Fundido a blanco' },
    { n: 2, dur: '~2.0 s', shots: ['boceto-4.png'], style: null, narr: 'Y el caballo que corre.', src: null, out: null },
    { n: 3, dur: '~4.0 s', shots: ['boceto-5.png'], style: 'style-9.png', narr: 'Pero detrás de cada carrera hay meses de trabajo que nadie ve.', src: { image: 'fuente-10.png' }, out: null },
  ];
  // A moment column is as wide as its bocetos (like on the board).
  const colW = (m, min = 250) => Math.max(min, 24 + m.shots.length * 200 + (m.shots.length - 1) * 16);
  const head = (m) => `<span class="num">${m.n}</span><span class="dur">${m.dur}</span>`;
  const source = (m, small) => !m.src ? '' : m.src.cita
    ? `<div class="cita">${m.src.cita}<br><b>— ${m.src.who}</b></div><a class="link" href="#">hipodromo.es/informe-2024</a>`
    : img(m.src.image, small ? 96 : 120, small ? 60 : 75);
  const adds = '<div class="adds"><span>+ cita</span><span>+ enlace</span><span>+ imagen</span></div>';

  const V = {
    A: {
      about: '<b>Actual.</b> Etiquetas de fila a la izquierda, filas de altura fija separadas por líneas, un hueco grande con «+» cuando falta el style frame y una fila de transición casi siempre vacía.',
      html: () => `<div class="A">
        <div class="labels"><div></div><div>Boceto</div><div>Transición</div><div>Style frame</div><div>Narración</div><div>Fuente</div></div>
        ${data.map((m) => `<div class="m" style="width:${colW(m)}px">
          <div class="h">${head(m)}</div>
          <div>${m.shots.map((s) => img(s, 200, 125)).join('')}</div>
          <div class="t">${m.cut ? `<span class="tr">${m.cut}</span>` : ''}</div>
          <div>${m.style ? img(m.style, 200, 125, 'style') : '<div class="slot" style="width:200px;height:125px">+</div>'}</div>
          <div class="n"><div class="narr">${m.narr}</div></div>
          <div class="s">${source(m, true)}${adds}</div>
        </div>`).join('')}
      </div>`,
    },
    B: {
      about: '<b>Aire, sin líneas.</b> La misma estructura (todo alineado en filas), pero separada por espacio en vez de líneas. La fila de transición se queda en una tira fina con las transiciones como etiquetas, y cuando falta el style frame solo sale «+ style frame», pequeño. Las fuentes ocupan lo que necesitan.',
      html: () => `<div class="B">
        <div class="labels"><div></div><div class="lab">Boceto</div><div class="lab">Transición</div><div class="lab">Style frame</div><div class="lab">Narración</div><div class="lab">Fuente</div></div>
        ${data.map((m) => `<div class="m" style="width:${colW(m, 230)}px">
          <div class="h">${head(m)}</div>
          <div>${m.shots.map((s) => img(s, 200, 125)).join('')}</div>
          <div class="t">${m.cut ? `<span class="tr" style="margin-left:150px">${m.cut}</span>` : ''}${m.out ? `<span class="tr" style="margin-left:auto">${m.out}</span>` : ''}</div>
          <div class="sf">${m.style ? img(m.style, 200, 125, 'style') : '<span class="pill">+ style frame</span>'}</div>
          <div class="n"><div class="narr">${m.narr}</div></div>
          <div class="s">${source(m, true)}${m.src ? '' : '<span class="pill">+ fuente</span>'}</div>
        </div>`).join('')}
      </div>`,
    },
    C: {
      about: '<b>Tarjetas.</b> Cada momento es una tarjeta propia, sin columna de etiquetas. Arriba las imágenes: bocetos y style frame juntos, con un rótulo pequeño debajo. Luego la narración, y abajo la fuente como pie. La transición entre bocetos va entre ellos, y la de salida al siguiente momento en la cabecera («→ …»).',
      html: () => `<div class="C">
        ${data.map((m) => `<div class="m">
          <div class="h">${head(m)}${m.out ? `<span class="tr">→ ${m.out}</span>` : ''}</div>
          <div class="pics">
            ${m.shots.map((s, k) => `<figure>${img(s, 170, 106)}<figcaption>Boceto${m.shots.length > 1 ? ' ' + (k + 1) : ''}</figcaption></figure>${k === 0 && m.cut ? '<div class="between" style="align-self:center;margin:0 -8px"><span class="tr" style="max-width:90px">' + m.cut + '</span></div>' : ''}`).join('')}
            ${m.style ? `<figure>${img(m.style, 96, 60, 'style')}<figcaption>Style</figcaption></figure>` : '<span class="pill" style="align-self:center">+ style</span>'}
          </div>
          <div class="narr">${m.narr}</div>
          <div class="foot">${m.src ? source(m, true) : '<span class="adds"><span>+ fuente</span></span>'}</div>
        </div>`).join('')}
      </div>`,
    },
    D: {
      about: '<b>Texto primero.</b> La narración manda (es el guion): va arriba y algo más grande. Debajo el boceto, con el style frame pequeño superpuesto en su esquina. Las transiciones, en una línea bajo las imágenes, y la fuente al final con una raya a la izquierda, como una cita.',
      html: () => `<div class="D">
        ${data.map((m) => `<div class="m ${m.shots.length > 1 ? 'wide' : ''}">
          <div class="h">${head(m)}</div>
          <div class="narr big">${m.narr}</div>
          <div class="pics">${m.shots.map((s) => img(s, 200, 125)).join('')}
            ${m.style ? `<div class="sf-mini">${img(m.style, 84, 52, 'style')}</div>` : ''}</div>
          <div class="trs">${m.cut ? `<span class="tr">${m.cut}</span>` : ''}${m.out ? `<span class="tr">→ ${m.out}</span>` : ''}${!m.style ? '<span class="pill">+ style frame</span>' : ''}</div>
          <div class="src">${m.src ? source(m, true) : '<span class="adds"><span>+ fuente</span></span>'}</div>
        </div>`).join('')}
      </div>`,
    },
    E: {
      about: '<b>Lado a lado.</b> Cada momento es una fila: a la izquierda las imágenes (bocetos y, al lado, el style frame), a la derecha el texto (narración y fuente). Los momentos van uno debajo de otro y la transición queda entre ellos. Mucho más bajo y fácil de leer de arriba abajo, pero la zona crece hacia abajo en vez de a lo ancho.',
      html: () => `<div class="E">
        ${data.map((m) => `<div class="m">
          <div><span class="num">${m.n}</span></div>
          <div class="col-img"><div class="row-img">${m.shots.map((s, k) => img(s, 176, 110) + (k === 0 && m.cut ? `<span class="tr">${m.cut}</span>` : '')).join('')}
            ${m.style ? img(m.style, 120, 75, 'style') : '<span class="pill">+ style frame</span>'}</div></div>
          <div class="col-txt"><span class="dur">${m.dur}</span><div class="narr">${m.narr}</div>${m.src ? source(m, true) : '<span class="adds"><span>+ fuente</span></span>'}</div>
        </div>${m.out ? `<div class="tr-cut"><span class="tr">↓ ${m.out}</span></div>` : ''}`).join('')}
      </div>`,
    },
  };

  let current = 'B';
  function show(v) {
    current = v;
    document.querySelectorAll('#variants button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
    document.getElementById('about').innerHTML = V[v].about;
    document.getElementById('zone').innerHTML = `<div class="zhead"><span class="order">1</span><span class="zname">Zona 1</span><span class="meta">3 momentos · 12.5 s</span></div>` + V[v].html();
  }
  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    document.querySelectorAll('#theme button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  }
  document.getElementById('variants').onclick = (e) => { if (e.target.dataset.v) show(e.target.dataset.v); };
  document.getElementById('theme').onclick = (e) => { if (e.target.dataset.t) setTheme(e.target.dataset.t); };
  setTheme('dark');
  show('A');
</script>
</body>
</html>
